# Records out of the product queue (P-371 (4), founder 6 Nov): records-only PRs, labelled "records" by ci.yml and
# "review: approved" by the Lead or qa, with green ci, merge outside Mergify's product queues, only while no merge-queue
# batch is checking (P-306 (3)), after the records checks on the base with each PR merged in (tools/records-merge.sh,
# which re-reads the PR's files, labels and head itself and trusts no label alone).
#   job "label": on the label review: approved (when ci is still running, ci.yml's job "records-merge" takes it after)
#   job "sweep": every 20 minutes and by hand ("Run workflow"), what the others left while batches were checking.
# Measured 4-5 Nov: the queue had no batch checking 31% of the time, with 31 gaps of 5 minutes or more in 45 hours.
# Every job checks out the base and runs the base's own script, never the PR's. No job here is named "ci".
name: records-merge
on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch: {}
permissions: { contents: write, pull-requests: write }
jobs:
  label:
    if: "${{ github.event_name == 'pull_request' && github.event.label.name == 'review: approved' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'records') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.base.ref }}", fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package-lock.json
      - name: merge it if no batch is checking (records checks on the base with it merged in first)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash "$P/tools/records-merge.sh" merge "${{ github.event.pull_request.number }}" --wait 10 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
  sweep:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: records-sweep, cancel-in-progress: false }
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package-lock.json
      - name: merge the waiting records PRs while no batch is checking
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash "$P/tools/records-merge.sh" sweep | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
