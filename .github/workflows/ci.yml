  ci:
    # The one check Mergify reads. Notes: the two notes checks here, on a GitHub machine. Records and code: only reports
    # the jobs' results (the Mac path is gone, D1). P-651 (2): a PR's head is green on fast + types with the parts and
    # packs skipped on purpose; a batch of code needs the parts, its packs by diff and the protected set as well.
    needs: [kind, fast, shard, packs, types, regression-plan, regression]
    if: "${{ !cancelled() && (!github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
      KIND: ${{ needs.kind.outputs.kind }}
      MODE: ${{ needs.kind.outputs.mode }}
    steps:
      - name: the change's kind was found
        run: |
          echo "kind: ${{ needs.kind.result }} (${KIND:-none})"; [ "${{ needs.kind.result }}" = success ] && [ -n "$KIND" ]
      # ---- P-371 (3): this head on this base was already judged: report that verdict, test nothing again
      - name: already judged on this head and base (the verdict of an earlier run)
        if: env.MODE == 'same'
        env: { VERDICT: "${{ needs.kind.outputs.verdict }}" }
        run: |
          echo "verdict: ${VERDICT% *} in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${VERDICT#* }"; [ "${VERDICT% *}" = success ]
      # ---- notes only (P-292 (2)): the two notes checks, and the push guard
      - uses: actions/checkout@v4
        if: env.MODE != 'same' && (env.KIND == 'notes')
        with: { fetch-depth: 0, filter: "blob:none" }
      - name: the test merge on main, then the push guard (D6; the notes checks below read the rebuilt tree)
        if: env.MODE != 'same' && (env.KIND == 'notes')
        env: { HEAD_SHA: "${{ github.event.pull_request.head.sha || inputs.head }}", QUEUE: "${{ needs.kind.outputs.queue }}", KBASE: "${{ needs.kind.outputs.base }}", KATTEMPT: "${{ needs.kind.outputs.battempt }}" }
        run: |
          if [ "$QUEUE" = true ]; then range=$(bash "$P/tools/pr-base.sh" queue)
          else pin=""; [ "$KATTEMPT" = "$GITHUB_RUN_ATTEMPT" ] && pin="$KBASE"; range=$(bash "$P/tools/pr-base.sh" merge "$HEAD_SHA" $pin); fi || exit 1
          echo "tested: $range"
          bash "$P/tools/push-guard.sh" "$range"
      - name: Mergify scopes match the module cards and the files (check-mergify-scopes.sh; P-756 (2), as job "fast")
        if: env.MODE != 'same' && (env.KIND == 'notes')
        run: bash "$P/tools/check-mergify-scopes.sh"
      # ENF-746c: the two notes checks judge records, so a merge-queue batch skips them (each PR passed them); the push guard stays.
      - name: notes check 1 of 2, rules files (check-docs.sh; pull requests only, ENF-746c)
        if: env.MODE != 'same' && (env.KIND == 'notes') && needs.kind.outputs.queue != 'true' && github.event_name != 'merge_group'
        run: bash "$P/tools/check-docs.sh"
      - name: notes check 2 of 2, decision impact (decision-impact.sh; pull requests only, ENF-746c)
        if: env.MODE != 'same' && (env.KIND == 'notes') && needs.kind.outputs.queue != 'true' && github.event_name != 'merge_group'
        run: bash "$P/tools/decision-impact.sh"
      # ---- records and code: the type check's result (P-291)
      - name: the type check's result
        if: env.MODE != 'same' && (env.KIND != 'notes')
        run: |
          echo "types: ${{ needs.types.result }}"; [ "${{ needs.types.result }}" = success ]
      # ---- records and code: the fast checks' result (P-651 (2), job "fast")
      - name: the fast checks' result
        if: env.MODE != 'same' && (env.KIND != 'notes')
        run: |
          echo "fast: ${{ needs.fast.result }}"; [ "${{ needs.fast.result }}" = success ]
      # ---- the parts' result: a batch of code needs them green; elsewhere none was planned, so the job is skipped
      - name: the parts' result
        if: env.MODE != 'same' && (env.KIND != 'notes')
        run: |
          r="${{ needs.shard.result }}"; planned='${{ needs.kind.outputs.shards }}'
          echo "parts: $r · planned: $planned"
          if [ "${{ needs.kind.outputs.suites }}" = true ] && [ "$KIND" = code ]; then
            [ "$r" = success ]
          else
            [ "$r" = skipped ]
            [ "$planned" = '[]' ]
          fi
      - name: the packs this change touches (D2, job "packs"; merge-queue batches of code, P-651 (2))
        if: env.MODE != 'same' && (env.KIND != 'notes')
        run: |
          r="${{ needs.packs.result }}"; groups='${{ needs.kind.outputs.dpacks }}'
          echo "packs by diff: $r · groups: $groups"
          if [ "${{ needs.kind.outputs.suites }}" = true ] && [ "$KIND" = code ]; then
            if [ "$r" != success ]; then
              [ "$r" = skipped ]
              [ "$groups" = '[]' ]
            fi
          else
            [ "$r" = skipped ]
          fi
      - name: the protected regression set's result (merge-queue batches of code, P-320 (b))
        if: env.MODE != 'same' && (needs.kind.outputs.suites == 'true' && env.KIND == 'code')
        run: |
          echo "plan: ${{ needs.regression-plan.result }} · packs: ${{ needs.regression.result }} · groups: ${{ needs.regression-plan.outputs.groups }}"
          [ "${{ needs.regression-plan.result }}" = success ] || exit 1
          # Every protected row held: an empty set, the job skipped, never a jam of every batch (review of #1337, m6).
          [ "${{ needs.regression.result }}" = success ] || { [ "${{ needs.regression.result }}" = skipped ] && [ '${{ needs.regression-plan.outputs.groups }}' = '[]' ]; }
      # ---- P-371 (3): a green verdict, so a later run on the same head, base, title and body (ready again) reuses it.
      # Only green: a red head is always tested again.
      - name: remember the green verdict (pull requests only, never a batch)
        # Only when the parts tested kind's base (kind ran in this attempt): a re-run attempt tested today's main, not mbase.
        if: success() && env.MODE != 'same' && needs.kind.outputs.queue != 'true' && needs.kind.outputs.mbase != '' && needs.kind.outputs.battempt == format('{0}', github.run_attempt)
        env: { MBASE: "${{ needs.kind.outputs.mbase }}", MHEAD: "${{ needs.kind.outputs.mhead }}", CTX: "${{ needs.kind.outputs.ctx }}" }
        run: |
          mkdir -p memory
          printf '#ci-memory 1\n#base %s\n#head %s\n#ctx %s\n#run %s %s\n#verdict success\n' "$MBASE" "$MHEAD" "$CTX" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "memory/verdict-a$GITHUB_RUN_ATTEMPT.tsv"
          echo "green verdict remembered for ${MHEAD:0:12} on ${MBASE:0:12}"
      - name: upload the verdict
        if: success() && env.MODE != 'same' && needs.kind.outputs.queue != 'true' && needs.kind.outputs.mbase != '' && needs.kind.outputs.battempt == format('{0}', github.run_attempt)
        uses: actions/upload-artifact@v4
        with:
          name: memory-verdict-a${{ github.run_attempt }}
          path: memory/
          retention-days: 7
          if-no-files-found: ignore
  retry-comment:
    # B122 F5: a pass on retry reaches its PR (or each PR of a merge-queue batch) as a comment, with its bug line and the
    # 1st try's log tail. Its own job, the only one with pull-requests: write (review of F5, Major 1): it never runs the
    # PR's code, only the base commit's tools/flaky.mjs on the parts' artifacts, with no token kept by checkout. Not a
    # check Mergify reads, and continue-on-error: it never holds a merge or turns a run red.
    needs: [kind, shard, ci]
    # P-651 (2): only a batch runs suites, so only a batch can have a pass on retry.
    if: ${{ always() && needs.kind.outputs.kind == 'code' && needs.kind.outputs.queue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "suite-retries-*", path: retries }
      - id: b
        name: any pass on retry? (retry-bugs.md in the parts' suite-retries-<part> artifacts)
        run: |
          shopt -s nullglob; f=(retries/*/retry-bugs.md)
          if [ ${#f[@]} -eq 0 ]; then echo "no pass on retry in this run"; echo "post=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          for x in "${f[@]}"; do d=$(basename "$(dirname "$x")"); echo "**Part ${d#suite-retries-}**"; echo; cat "$x"; echo; done > retry-bugs.md
          echo "post=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.b.outputs.post == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: ai-workers/problem-1-pathway-setup-and-form-filling/product/tools
      - name: post it (tools/flaky.mjs comment, from the base commit)
        if: steps.b.outputs.post == 'true'
        env: { GITHUB_TOKEN: "${{ github.token }}", PR_BODY: "${{ github.event.pull_request.body }}", PR: "${{ github.event.pull_request.number }}", QUEUE: "${{ needs.kind.outputs.queue }}" }
        run: |
          q=(); if [ "$QUEUE" = true ]; then q=(--queue); fi
          node base/ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/flaky.mjs comment --body retry-bugs.md --pr "$PR" "${q[@]}"
