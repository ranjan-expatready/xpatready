        env: { HEAD_SHA: "${{ github.event.pull_request.head.sha || inputs.head }}", QUEUE: "${{ needs.kind.outputs.queue }}", KBASE: "${{ needs.kind.outputs.base }}", KATTEMPT: "${{ needs.kind.outputs.battempt }}" }
        run: |
          if [ "$QUEUE" = true ]; then range=$(bash "$P/tools/pr-base.sh" queue)
