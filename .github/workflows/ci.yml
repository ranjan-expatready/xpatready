# CI (P-81, P-82, P-85 as amended 28 Oct): one job per pull request, nothing on a plain push.
# Cost rule (founder, 28 Oct): GitHub Actions minutes stay within the monthly allowance with no loss of quality.
# Every lane and the Lead already run the same full suites on the Mac (tools/run-suites.sh) and the push guard runs
# locally before every push (.githooks/pre-push), so GitHub gives the one independent check where it matters: the
# pull request to main, tested on its merge result. Per pull request, in one job (each job bills at least a minute):
#   * always: the push guard on the pull request's commits, the rules-file checks, the decision-impact check, the
#     graph check (P-86) and the official IRCC PDF checksums (P-31);
#   * when the pull request changes code (files under prototype/, except docs, images and PDFs, or the suites' own tools
#     and this file): the explicit-any count and the studio suites its files can affect (run-suites.sh --changed, plus a
#     smoke set; everything when a shared file changed; no model call, US$0) on the founder's Mac (self-hosted runner
#     xr-mac, free; P-195, 31 Oct: GitHub's machines used the US$10 monthly budget in one morning). The full set runs
#     every night on main on the same Mac (nightly.yml).
# A lane opens its pull request when its work is ready for the Lead's check, so a code change is tested about once;
# a newer push to the pull request cancels the older run. Docs-only pull requests (most Lead PRs) take about a minute.
name: ci
on:
  pull_request:
jobs:
  ci:
    # P-195 (founder, 31 Oct): back on the Mac. Builders now run in the cloud, so the Mac runs only checks, the demo and
    # the Lead. The browser suite runs on its own isolated copy, never the :4400 demo (no --demo).
    runs-on: [self-hosted, macOS, xr-mac]
    timeout-minutes: 90   # P-183: a busy Mac never stops a check halfway
    permissions: { contents: read }
    concurrency: { group: "ci-${{ github.event.pull_request.number }}", cancel-in-progress: true }
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: push guard (excluded paths, PDFs, secrets, personal names)
        run: |
          chmod +x "$P/tools/push-guard.sh"
          "$P/tools/push-guard.sh" "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - id: code
        name: does this pull request change code?
        env: { HEAD_REF: "${{ github.event.pull_request.head.ref }}" }
        run: |
          # No early-exit grep in a pipe: under pipefail its SIGPIPE would read as "no code changed".
          # Code = the app and its tools under prototype/, the build setup, and the suites' own tools and this file (they
          # change how the suites run); the product records, their checkers and boards run only the fast checks above
          # (founder, 29 Oct: no full suites for records PRs).
          code=$(git -c core.quotePath=false diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -E '^(ai-workers/problem-1-pathway-setup-and-form-filling/prototype/|ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/(run-suites\.sh|select-suites\.mjs|cloud-setup\.sh)$|\.github/workflows/ci\.yml$|\.nvmrc$)' | grep -ivE '\.(md|txt|png|jpe?g|gif|webp|svg|pdf)$' || true)
          # P-201: a builder's own PR gets the fast checks only; the suites run once per merge-queue batch (Mergify's
          # batch PRs come from branches mergify/merge-queue/...), on the result that will land on main.
          if [ -n "$code" ] && [[ "$HEAD_REF" != mergify/* ]]; then
            echo "Code changed: the suites run when this PR's merge-queue batch is checked (P-201)." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "suites=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$code" ]; then
            echo "Docs and records only: suites not needed." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "suites=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"; echo "suites=true" >> "$GITHUB_OUTPUT"
      - name: the Mac's tools (node 24, venv, official PDFs, database) linked like a lane copy (lane.sh setup)
        run: |
          [ -e .tools ] || ln -s "$HOME/Desktop/Xpatready/.tools" .tools
          # Each line added is put in front of the last one: node 24 last, so it wins over Homebrew's node 23.
          echo /opt/homebrew/bin >> "$GITHUB_PATH"; echo /opt/homebrew/opt/postgresql@18/bin >> "$GITHUB_PATH"; echo "$PWD/.tools/node-v24.21.0/bin" >> "$GITHUB_PATH"
      - name: node 24
        run: |
          node --version | grep -q '^v24\.' || { echo "node 24 not first on PATH - $(command -v node) $(node --version)"; exit 1; }
      - name: packages (npm ci; the graph and any-count checks read TypeScript from them)
        run: cd "$S" && npm ci --no-fund --no-audit
      - name: rules files, decision impact, graph (P-86)
        run: |
          bash "$P/tools/check-docs.sh" && bash "$P/tools/decision-impact.sh" && node "$P/tools/graph.mjs" --check
      - name: official IRCC PDFs (manifest checksums, P-31)
        run: python3 ai-workers/problem-1-pathway-setup-and-form-filling/official-sources/fetch_official_sources.py
      - name: web app build (the browser suites need it)
        if: steps.code.outputs.changed == 'true'
        run: cd "$S" && ./node_modules/.bin/prisma generate && cd web && ../node_modules/.bin/vite build
      - name: explicit-any count
        if: steps.code.outputs.changed == 'true'
        run: node "$S/tools/count-any.mjs" --against "${{ github.event.pull_request.base.sha }}"
      - name: Playwright's own Chromium
        if: steps.code.outputs.suites == 'true'
        run: cd "$S" && ./node_modules/.bin/playwright install chromium
      - name: studio suites this change can affect (run-suites.sh --changed, browser suite on its own copy; US$0)
        if: steps.code.outputs.suites == 'true'
        # Two test slots on the Mac (P-199): each runner gets its own copy names and ports, so two checks never meet.
        env: { COPY_PREFIX: "${{ runner.name == 'xr-mac-2' && 'ci2' || 'ci' }}", SUITES_BROWSER_ISOLATED: "1", SUITES_CI_FIRST: "1" }
        # One at a time (a parallel trial, 30 Oct, failed 12 suites). Copies named ci_*, like the nightly run; the one
        # runner runs one job at a time, so they never meet. The chosen suites and why print first, into the summary.
        run: |
          bash "$P/tools/run-suites.sh" --changed "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" | tee suites.md
          exit ${PIPESTATUS[0]}
      - name: summary
        if: always() && steps.code.outputs.suites == 'true'
        run: '[ -f suites.md ] && cat suites.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: logs (only when something failed)
        if: failure() && steps.code.outputs.suites == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/var/suites/
          retention-days: 14
