            export PR_TITLE PR_BODY
          fi
          if [ "$SUITES" = true ]; then node "$S/tools/gate-b.mjs"; else node "$S/tools/gate-b.mjs" --no-packs; fi
      - name: no personal data in logs (PF-23; the server logs a batch's gate B packs wrote; a few seconds)
        if: ${{ !cancelled() && env.KIND == 'code' && env.SUITES == 'true' }}
        run: |
          cd "$S"
          ./node_modules/.bin/tsx api/src/platform/observability/scan-logs.ts --self-test
          ./node_modules/.bin/tsx api/src/platform/observability/scan-logs.ts
  shard:
    # P-651 (2): the suites, on a merge-queue batch of code only (a PR's head runs none), on GitHub's machines.
    needs: kind
    if: ${{ needs.kind.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75 # 10 Nov (P-214): parts now reach 44-56 min; 3 of the last 7 full runs had parts stopped at 60 (run 42762001529 lost three, dequeuing #1450 after 1 h of CI). 9 Nov: raised from 45 for the same reason. The lasting fix, 8 shards dealt by refreshed suite times (pipeline row 2, P-436 (7)), puts the longest part at about 32-35 min on the 10 Nov batches; the limit stays 75 until a week of runs shows it.
    permissions: { contents: read, pull-requests: read }
    strategy:
      # P-371 (2): every part runs to its end, so a red part is re-run alone (Re-run failed jobs) and the green parts'
      # suites are remembered; stopping them threw their work away (fail-fast cost whole re-runs before 6 Nov).
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.kind.outputs.shards) }}
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
      KIND: ${{ needs.kind.outputs.kind }}
      QUEUE: ${{ needs.kind.outputs.queue }}
      N: ${{ needs.kind.outputs.n }}
      SUITES_QUARANTINE_AUTO: ${{ needs.kind.outputs.autoq }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: the batch's base at run time (D6, tools/pr-base.sh queue; a batch keeps GitHub's merge); a full run rebuilds the test merge (CI-PRE)
        env: { HEAD_SHA: "${{ inputs.head }}", KBASE: "${{ needs.kind.outputs.base }}", KATTEMPT: "${{ needs.kind.outputs.battempt }}" }
        run: |
          if [ "$QUEUE" = true ]; then range=$(bash "$P/tools/pr-base.sh" queue)
          else pin=""; [ "$KATTEMPT" = "$GITHUB_RUN_ATTEMPT" ] && pin="$KBASE"; range=$(bash "$P/tools/pr-base.sh" merge "$HEAD_SHA" $pin); fi || exit 1
          echo "RANGE=$range" >> "$GITHUB_ENV"; echo "tested: $range"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}   # CI-PRE: a full run (a run of main) saves nothing to main's cache
          cache-dependency-path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package-lock.json
      - name: set up like a cloud session (cloud-setup.sh; it also builds the web app the browser suites need)
        run: bash "$P/tools/cloud-setup.sh"
      - name: Playwright's own Chromium
        if: env.KIND == 'code'
        run: cd "$S" && ./node_modules/.bin/playwright install chromium
      - name: studio suites, part ${{ matrix.shard }} of ${{ needs.kind.outputs.n }} (run-suites.sh --demo --retry --shard; US$0 model spend)
        if: env.KIND == 'code'
        run: |
          bash "$P/tools/run-suites.sh" --demo --retry --skip-quarantined --shard "${{ matrix.shard }}/$N" | tee suites.md
          exit ${PIPESTATUS[0]}
      - name: no personal data in logs (PF-23, Doc-1 release gate; every server log this part's suites wrote; a few seconds)
        # SA-11 BR-16, SA-11-37: the servers above log through PF-23's redacting logger; this reads every copy's api.log
        # and fails on a seeded personal value (the sample data's people, PF-23's canaries), an email address, a bearer
        # credential or a JWT, naming file, line and rule, never the value. Its self-test first proves a planted leaking
        # line fails. Runs even when a suite failed, so a leak is never hidden behind a red suite.
        if: ${{ !cancelled() && env.KIND == 'code' }}
        run: |
          cd "$S"
          ./node_modules/.bin/tsx api/src/platform/observability/scan-logs.ts --self-test
          ./node_modules/.bin/tsx api/src/platform/observability/scan-logs.ts
      - name: summary
        if: always() && env.KIND == 'code'
        run: '[ -f suites.md ] && cat suites.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: logs (only when something failed)
        if: failure() && env.KIND == 'code'
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-shard-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/var/suites/
          retention-days: 14
      - name: retry records (B122; only when a suite was retried; tools/flaky.mjs reads them)
        if: always() && env.KIND == 'code'
        uses: actions/upload-artifact@v4
        with:
          name: suite-retries-${{ matrix.shard }}
          # The records, each retried suite's first-try log and api.log (the evidence its owner needs), and F5's bug
          # lines (retry-bugs.md), which the job retry-comment posts.
          path: |
            ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/var/suites/retries.tsv
            ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/var/suites/retry-bugs.md
            ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/var/suites/*.try1*.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
  packs:
    # D2 (P-416, 8 Nov; review of #1337): the packs this change touches (kind's gate-b.mjs --diff-groups 5), one machine a
    # group, gate B's 3 slots, each row on its scoring data; a red group is run once more (a flaky pack is retried once).
    # P-651 (2): on a merge-queue batch of code only (kind works the set out on the batch's range; a PR's head runs none).
    needs: kind
    if: ${{ needs.kind.outputs.mode != 'same' && needs.kind.outputs.dpacks != '' && needs.kind.outputs.dpacks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.kind.outputs.dpacks) }}
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: the batch's base (D6, tools/pr-base.sh queue; a batch keeps GitHub's merge); a PR's test merge stays pinned to kind's main
        # Devin on #1337: "Re-run failed jobs" keeps kind's plan, so this job keeps kind's base too; "Re-run all jobs"
        # re-plans on today's main.
        env: { HEAD_SHA: "${{ github.event.pull_request.head.sha || inputs.head }}", KBASE: "${{ needs.kind.outputs.base }}", QUEUE: "${{ needs.kind.outputs.queue }}" }
        run: |
          if [ "$QUEUE" = true ]; then range=$(bash "$P/tools/pr-base.sh" queue); else range=$(bash "$P/tools/pr-base.sh" merge "$HEAD_SHA" "$KBASE"); fi || exit 1
          echo "RANGE=$range" >> "$GITHUB_ENV"; echo "tested: $range"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}   # CI-PRE: a full run (a run of main) saves nothing to main's cache
          cache-dependency-path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package-lock.json
      - name: set up like a cloud session (cloud-setup.sh; it also builds the web app the browser packs need)
        run: bash "$P/tools/cloud-setup.sh"
      - name: Playwright's own Chromium
        run: cd "$S" && ./node_modules/.bin/playwright install chromium
      - name: packs by diff ${{ matrix.group.caps }} (${{ matrix.group.packs }} packs, gate B's 3 slots; live AI off, US$0)
        env: { CAPS: "${{ matrix.group.caps }}", GATE_B_DATA_OF: "${{ matrix.group.data }}", GATE_B_SKIP_PACKS: "${{ matrix.group.skip }}", GATE_B_NO_DIFF: "1", GATE_B_JOBS: "3", KIND: code, QUEUE: "", PR_TITLE: "", PR_BODY: "", GATE_B_NOT_TESTED: "${{ github.event_name == 'workflow_dispatch' && 'warn' || '' }}" }
        run: |
          r=0; node "$S/tools/gate-b.mjs" --title "$CAPS" --kind code || r=$?
          case "$r" in 0) exit 0;; 1|2) ;; *) exit "$r";; esac
          echo "red (exit $r): once more (a flaky pack is retried once; red twice is red)"
          GATE_B_NAME=gatebr GATE_B_PORT=4600 node "$S/tools/gate-b.mjs" --title "$CAPS" --kind code
  types:
    # P-291: tsc --noEmit for api and web, beside the parts (no added wall time); records and code, never notes.
