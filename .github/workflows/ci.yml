# CI (P-81, P-82, P-85 as amended 28 Oct): one run per pull request, nothing on a plain push. Mergify's merge queue
# needs the job "ci" green (check-success = ci), for a builder's PR and for each batch PR (branch mergify/merge-queue/...).
# I1, 3 Nov (P-291 (3) and (8), P-292 (2)): what runs depends on what the change is (job "kind", tools/change-kind.sh):
#   * notes   (only *.md records and files under product/reports/): check-docs.sh and decision-impact.sh, plus the push
#             guard (excluded paths, secrets, personal names), on one GitHub machine; nothing else, about a minute.
#             Records-only PRs are labelled "records" for Mergify's records queue (P-371 (4), below) by
#             records-label.yml, not here (P-214 fix, 7 Nov: no job of this workflow runs the PR's code with a write token).
#   * records (boards, guards, settings, other workflows): the fast checks on one machine (push guard, rules files,
#             decision impact, graph P-86, official PDFs P-31, explicit-any count, the tools' own checks); no suites.
#   * code    (the app, its suites or their tools; select-suites.mjs decides): the fast checks (job "fast") and, on a
#             merge-queue batch only (P-651 (2), below), the studio suites on the parallel parts (job "shard",
#             run-suites.sh --shard i/n, each a fresh copy): every suite but the quarantined ones (--skip-quarantined),
#             once per change; a builder's PR runs no suite. A batch retries a failed suite once (B122, P-376 (8), run-suites.sh --retry): "passed on retry" or "failed
#             twice" in the summary, a record uploaded as suite-retries-<part>; a suite that passed only on retry in 2
#             runs in 7 days is quarantined for every part (tools/flaky.mjs in job "kind"). The nightly never retries.
#             F5 (founder 6 Nov): a suite named or titled race, concurrent, parallel or upsert, or on the quarantine
#             list, is never retried; a pass on retry is never silent: a bug line in the job summary and a PR comment
#             (on each PR of a merge-queue batch) with the 1st try's log tail; the batch may still merge. The comment
#             comes from its own job, retry-comment, the only one with pull-requests: write: it runs the base commit's
#             flaky.mjs on the parts' artifacts, so the write token never meets the PR's own code (npm install, suites).
#             US$0 model spend: every suite replays saved runs.
# Run tests once (P-651 (2), founder 17 Nov; started 18 Nov): a builder's PR runs only the fast checks (job "fast": the
#   push guard, rules files, tools' own checks, gate B part 1 with --no-packs) and job "types"; the full test set (the
#   suites on the parts, the packs by diff, the protected regression set, gate B's named packs) runs once, on the
#   merge-queue batch, which every merge passes (no gate lowered, P-614). Main is tested by the nightly full set (no push
#   trigger: P-85). Gate B on the batch (GATE_B_ONCE, gate-b.mjs): every row a batch PR names runs with its steps, Works
#   and held rows too (P-488), and job "packs" runs each member's packs by diff minus the rows its PR names. Records, PR
#   or batch: job "fast" alone; no part.
# ENF-746c (P-746, founder 20 Nov): the records rules (check-docs.sh, decision-impact.sh: STATE, RULES and DECISIONS
#   locks, the rule register, decision impact) run on a pull request only; a merge-queue batch (kind's queue, or a
#   merge_group event) skips them, and every code check still runs there. Test: product/tools/check-queue-run-scope.sh.
# Switches (repository variables, gh variable set NAME --body VALUE):
# Type check (P-291, the outsider audit of 29 Oct): job "types", tsc --noEmit for api and web (tools/typecheck.mjs; fails
#   only on an error not in typecheck-known.txt), on its own machine beside the parts for records and code, so it adds
#   machine minutes (about 2 a run) but no wall time: the parts take 20+ minutes, the type check about 1.5.
#   SHARDS=<1..24>       the number of parallel parts (default 18 since 19 Nov, repository variable SHARDS set to 18; before: default 8: pipeline row 2, 10 Nov, measured in its PR; was 4,
#                        and the repository variable SHARDS is 6 since 9 Nov, which overrides this default until it
#                        is deleted or set to 8; I1 measured before changing it: see its PR);
#   PR_SUITES=direct     idle since P-651 (2) (a builder's PR runs no suite; it was select-suites.mjs --direct); it
#                        still enters the memory verdict's context, so changing it re-tests a head; the queue runs every suite;
#   (BATCH_RUNNER / PR_RUNNER = mac, the founder's Mac, are gone: D1, P-416, 8 Nov; off since 4 Nov. git has them.)
# Base at run time (D6, P-416, founder 8 Nov): every job of a pull request rebuilds the test merge on origin/main as the
#   job finds it (tools/pr-base.sh) and reads RANGE = "$(git merge-base origin/main HEAD)..<head>", never the event's
#   base.sha, so "Re-run failed jobs" after a fix on main tests that fix. The parts of one attempt test the main the job
#   "kind" merged onto (pinned); a re-run attempt takes today's main. A batch keeps GitHub's merge (Mergify built it).
# Flow fix (P-371, founder 6 Nov; measured 4-5 Nov: 50% of PR-check machine hours thrown away, 181 runs cancelled by a
# newer push, 118 failed): the same checks, run once, never thrown away; no gate removed.
#   (1) Saving work costs no check: a push to a DRAFT PR runs only the job "guard" (push guard: excluded paths, PDFs,
#       secrets, personal names; under a minute). The full check runs when the PR is marked ready for review.
#       Mergify's batch PRs (mergify/*, opened as drafts) always get it (#875).
#   (2) A ready head's check is never cancelled: a newer push waits for it (workflow concurrency below; only a
#       waiting run is replaced, before it starts, at no machine cost). Parts never stop each other (fail-fast off), so a
#       red part is re-run alone: "Re-run failed jobs" on the run's page, or gh run rerun <run-id> --failed.
#   (3) Results are remembered (tools/ci-memory.mjs): a head already green on this base with the same title and body
#       (ready again, a reopen) reports that verdict; a red head is always tested again. (Suites remembered green per
#       PR are gone with P-651 (2): a PR runs no suite; git has them.) The merge queue and the nightly never use memory.
#   (4) Records out of the product queue: a records-only PR (tools/records-only.sh, the one definition) is labelled
#       "records" by records-label.yml (pull_request_target, main's code only; moved out of job "kind" 7 Nov), and the
#       label comes off when the change stops being records only. Mergify's "records" queue
#       (B119) selects PRs by that label and the product queue skips it, so records never join a product batch (Lead 21, 6 Nov:
#       one route, the queue; no direct merge).
# Full run before the label (CI-PRE, P-731, founder 19 Nov): workflow_dispatch with a PR's number and head runs, on that
#   head merged with main's head, every suite a merge batch runs (the parts, the packs by diff as a PR ran them before
#   P-651, the protected set, gate B's named packs). Started by the PR comment "/run full" (comment-run.yml), always
#   on ref main, so the jobs are main's copy of this file, never the PR's; the PR's code runs in them with read-only
#   tokens, as in a batch. queue-gate.sh reads the run by its name ("full-run PR #<n> <head>", built from the inputs
#   that also choose what is tested) and accepts `review: approved` only when it is green. Only this repository's own
#   branches (comment-run.yml refuses a fork): the run sits on main's side of the Actions cache.
name: ci
# Quoted: " #" would start a YAML comment. Empty on a pull request: GitHub then names the run as before.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('full-run PR #{0} {1}', inputs.pr, inputs.head) || '' }}"
on:
  workflow_dispatch:
    inputs:
      pr: { description: "pull request number", required: true, type: string }
      head: { description: "that pull request's head, 40 hex characters", required: true, type: string }
  pull_request:
    # P-214, 4 Nov: a draft ran nothing; P-371 (1): a draft runs the guard. No "labeled": a label must never start a
    # second run whose "ci" check goes back to in progress just as Mergify queues the PR (review, 6 Nov).
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  # One group per PR and mode: a draft's guard runs replace each other; a full check is never cancelled (P-371 (2)).
  # Re-run failed jobs only on a PR's newest run: an older run re-entering the group replaces a newer one still waiting.
  group: "ci-${{ github.event.pull_request.number || format('full-{0}', inputs.head) }}-${{ (!github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/')) && 'full' || 'draft' }}"
  cancel-in-progress: "${{ !(!github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/')) }}"
jobs:
  guard:
    # P-371 (1): a draft PR's push runs only this; a draft's "ci" is skipped, and Mergify's queues also refuse drafts.
    if: "${{ !(!github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - name: push guard (excluded paths, PDFs, secrets, personal names); the full check runs when the PR is ready
        run: |
          range=$(bash "$P/tools/pr-base.sh" range "${{ github.event.pull_request.head.sha }}")   # D6: today's main
          bash "$P/tools/push-guard.sh" "$range"
          echo "**Draft: push guard only** (P-371). The suites run once, when the PR is marked ready for review." >> "$GITHUB_STEP_SUMMARY"
  kind:
    if: "${{ (!github.event.pull_request.draft || startsWith(github.event.pull_request.head.ref, 'mergify/')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read for the PR's earlier runs (memory). Read-only (P-214 fix, 7 Nov): this job runs the PR's own scripts
    # (change-kind.sh, flaky.mjs, ci-memory.mjs, run-suites.sh), so it never holds a write token; the "records" label is
    # set by .github/workflows/records-label.yml, which runs only main's code (product/tools/check-write-token.sh).
    permissions: { contents: read, actions: read, pull-requests: read }   # pull-requests: a batch's PR bodies (gate-b.mjs, step d)
    outputs:
      autoq: ${{ steps.q.outputs.autoq }}
      kind: ${{ steps.k.outputs.kind }}
      shards: ${{ steps.m.outputs.mode == 'same' && '[]' || steps.m.outputs.shards || steps.k.outputs.shards }}
      n: ${{ steps.m.outputs.n || steps.k.outputs.n }}
      queue: ${{ steps.k.outputs.queue }}
      suites: ${{ steps.k.outputs.suites }}   # the full set runs: a merge-queue batch, or a full run (CI-PRE)
      mode: ${{ steps.m.outputs.mode }}
      verdict: ${{ steps.m.outputs.verdict }}
      green: ${{ steps.m.outputs.green }}
      mbase: ${{ steps.m.outputs.mbase }}
      mhead: ${{ steps.m.outputs.mhead }}
      ctx: ${{ steps.m.outputs.ctx }}
      base: ${{ steps.b.outputs.base }}
      battempt: ${{ steps.b.outputs.battempt }}
      dpacks: ${{ steps.d.outputs.dpacks }}
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: b
        name: the test merge on today's main (D6, tools/pr-base.sh; a batch keeps GitHub's merge)
        env: { HEAD_REF: "${{ github.event.pull_request.head.ref }}", PR_AUTHOR: "${{ github.event.pull_request.user.login }}", HEAD_SHA: "${{ github.event.pull_request.head.sha || inputs.head }}", FULL_PR: "${{ inputs.pr }}", GH_TOKEN: "${{ github.token }}", REVIEWERS: "${{ vars.REVIEWERS }}" }
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # CI-PRE: before any of the PR's code is here (this is still main's tree): the inputs are a number and a
            # commit id, and that commit is that PR's head now, in this repository, so the run's name tells the truth.
            [[ "$FULL_PR" =~ ^[1-9][0-9]{0,6}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::full run: pr and head must be a number and a 40-hex commit id"; exit 1; }
            now=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FULL_PR" --jq '"\(.head.sha) \(.head.repo.full_name // "")"') || exit 1
            [ "$now" = "$HEAD_SHA $GITHUB_REPOSITORY" ] || { echo "::error::full run: that commit is not the head of this repository's PR #$FULL_PR now"; exit 1; }
            # Only a reviewed head runs in a run of main, however the run was started (comment-run.yml asks the same;
            # a dispatch by hand passes it by): "Reviewer: Approve <this head>" by the owner's account or a known reviewer.
            export WHO="${GITHUB_REPOSITORY%%/*} $REVIEWERS"
            ok=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$FULL_PR/comments?per_page=100" --jq '[.[] | select(.user.login as $l | (env.WHO | split(" ")) | index($l)) | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
              | select((.body // "") | gsub("[*_`]"; "") | test("(^|\n)\\s*reviewer:\\s*approve[sd]?\\s+" + env.HEAD_SHA + "\\b"; "i"))] | length') || exit 1
            grep -qx '[1-9][0-9]*' <<< "$ok" || { echo "::error::full run: no \"Reviewer: Approve <this head>\" line by the owner's account or a known reviewer on PR #$FULL_PR"; exit 1; }
          fi
          # A batch only when Mergify opened it (gate B break M2): a builder's branch named mergify/* stays a pull request.
          if [[ "$HEAD_REF" == mergify/* && "$PR_AUTHOR" == "mergify[bot]" ]]; then range=$(bash "$P/tools/pr-base.sh" queue)
          else range=$(bash "$P/tools/pr-base.sh" merge "$HEAD_SHA"); fi || exit 1
          { echo "RANGE=$range"; } >> "$GITHUB_ENV"
          { echo "base=${range%%..*}"; echo "battempt=$GITHUB_RUN_ATTEMPT"; } >> "$GITHUB_OUTPUT"
          echo "**Base:** main ${range:0:12} (event base ${{ github.event.pull_request.base.sha }}; D6: worked out at run time)" >> "$GITHUB_STEP_SUMMARY"
      - id: k
        name: what does this change? (notes, records or code; tools/change-kind.sh)
        env: { HEAD_REF: "${{ github.event.pull_request.head.ref }}", SHARDS_VAR: "${{ vars.SHARDS }}", PR_AUTHOR: "${{ github.event.pull_request.user.login }}" }
        run: |
          kind=$(bash "$P/tools/change-kind.sh" "$RANGE") || { echo "change-kind.sh failed"; exit 1; }
          # A batch only when Mergify opened it (gate B break M2): a builder's branch named mergify/* stays a pull request.
          queue=false; [[ "$HEAD_REF" == mergify/* && "$PR_AUTHOR" == "mergify[bot]" ]] && queue=true
          n="${SHARDS_VAR:-18}"; [[ "$n" =~ ^([1-9]|1[0-9]|2[0-4])$ ]] || n=18   # 19 Nov (Lead 94, A214): 8 parts ran 43-60 min, no machine wait; 18 parts reach the floor set by the longest suite (check_b78, ~20 min)
          # P-651 (2): the parts run only on a batch of code; the fast checks are job "fast" (records and code).
          shards="[]"
          suites=$queue; if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then suites=true; fi   # CI-PRE: a full run runs what a batch runs
          if [ "$kind" = code ] && [ "$suites" = true ]; then shards="[$(seq -s, 1 "$n")]"; fi
          { echo "kind=$kind"; echo "shards=$shards"; echo "n=$n"; echo "queue=$queue"; echo "suites=$suites"; } >> "$GITHUB_OUTPUT"
          case "$kind" in
            notes) why="Notes only: check-docs.sh and decision-impact.sh (and the push guard); no suites, no app build.";;
            records) why="Records, no code: the fast checks on one machine; no suites.";;
            *) [ "$suites" = true ] && why="Code, $([ "$queue" = true ] && echo "merge-queue batch" || echo "full run before the label (CI-PRE)"): every suite but the quarantined ones on $n parts, the packs by diff and the protected set." || why="Code, pull request: the fast checks and the type check only (P-651 (2): the suites and packs run once, in the merge queue).";;
          esac
          echo "**$kind** · $why" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: q
        name: flaky suites to quarantine (B122; passed only on retry in 2 runs in 7 days; tools/flaky.mjs)
        # Worked out once here, so every part deals and skips the same suites. A failure of the API never fails the
        # check: no automatic quarantine this run, said in the summary. It reads all 24 parts' records (SHARDS may have
        # been higher in the last 14 days; review round 2, minor 2).
        if: steps.k.outputs.kind == 'code' && steps.k.outputs.suites == 'true'
        timeout-minutes: 3
        continue-on-error: true
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          if q=$(node "$P/tools/flaky.mjs" quarantine 2> flaky.err); then cat flaky.err
          else q=""; cat flaky.err; echo "::warning::flaky.mjs could not read the retry records: no automatic quarantine this run"; fi
          echo "autoq=$q" >> "$GITHUB_OUTPUT"
          [ -z "$q" ] || { echo "**Quarantined automatically (B122):**"; sed 's/^/- /' flaky.err; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.k.outputs.kind == 'code' && steps.k.outputs.suites == 'true'
        with: { node-version-file: .nvmrc }
      - id: d
        name: packs this batch touches (D2 on the batch, P-651 (2); gate-b.mjs --diff-groups 5; run by job "packs")
        # For each member merge: a pack it changes or adds (its row if built) and every Works row whose pack reads a
        # changed file, minus the rows its own PR names (job "fast" runs them, with their steps) and the Works rows only
        # read (job "regression" runs them); in at most 5 groups (GATE_B_ONCE). Reads files and the batch PRs' bodies.
        if: steps.k.outputs.kind == 'code' && steps.k.outputs.suites == 'true'
        # CI-PRE, a full run: one PR, so the set by diff as a pull request had it before P-651 (QUEUE empty, no ONCE), with
        # the PR's title and body read from GitHub (a dispatch carries none); a superset of what its batch runs by diff.
        env: { KIND: code, QUEUE: "${{ steps.k.outputs.queue }}", GATE_B_ONCE: "${{ steps.k.outputs.queue == 'true' && '1' || '' }}", GITHUB_TOKEN: "${{ github.token }}", PR_TITLE: "${{ github.event.pull_request.title }}", PR_BODY: "${{ github.event.pull_request.body }}", FULL_PR: "${{ inputs.pr }}", GATE_B_NOT_TESTED: "${{ github.event_name == 'workflow_dispatch' && 'warn' || '' }}" }
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FULL_PR" --jq .title) || exit 1
            PR_BODY=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FULL_PR" --jq '.body // ""') || exit 1
            export PR_TITLE PR_BODY
          fi
          g=$(node "$S/tools/gate-b.mjs" --diff-groups 5) || exit 1
          [[ "$g" == \[* ]] || { echo "gate-b.mjs --diff-groups printed no JSON: $g"; exit 1; }
          echo "dpacks=$g" >> "$GITHUB_OUTPUT"; echo "by diff: $g"
      - id: m
        name: memory (P-371 (3)) — this head already judged on this base? suites green earlier with unchanged inputs?
        # Never for a merge-queue batch or a fork. Reads only this PR's own earlier runs of this workflow.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          KIND: ${{ steps.k.outputs.kind }}
          QUEUE: ${{ steps.k.outputs.queue }}
          N: ${{ steps.k.outputs.n }}
          PR_SUITES: ${{ vars.PR_SUITES }}
          SUITES_QUARANTINE_AUTO: ${{ steps.q.outputs.autoq }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SWITCHES: "${{ vars.PR_SUITES }}"
        run: |
          mbase=$(git rev-parse HEAD^1); mhead=$(git rev-parse HEAD^2)   # the test merge's parents: the base and head tested
          # The verdict's context: gate B reads the title and body; the switch chooses what runs.
          ctx=$(printf '%s\n%s\n%s' "$PR_TITLE" "$PR_BODY" "$SWITCHES" | sha256sum | cut -d' ' -f1)
          { echo "mbase=$mbase"; echo "mhead=$mhead"; echo "ctx=$ctx"; } >> "$GITHUB_OUTPUT"
          mode=full
          if [ "$QUEUE" != true ] && [ "$SAME_REPO" = true ]; then
            M="$RUNNER_TEMP/memory"; mkdir -p "$M"
            ids=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f event=pull_request -f branch="$HEAD_REF" -f per_page=20 \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .head_repository.full_name == \"$GITHUB_REPOSITORY\") | .id" | head -8) || ids=""
            for id in $ids; do gh run download "$id" -p 'memory-*' -D "$M/$id" >/dev/null 2>&1 || true; done
            echo "memory: $(find "$M" -name '*.tsv' | wc -l) files from $(echo $ids | wc -w) earlier runs of this PR"
            verdict=$(node "$P/tools/ci-memory.mjs" verdict-of --dir "$M" --base "$mbase" --head "$mhead" --ctx "$ctx")
            if [ -n "$verdict" ]; then
              mode=same; echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
              echo "**Already green:** this head on this base, with this title and body, passed in run ${verdict#* } ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${verdict#* }); nothing re-runs." >> "$GITHUB_STEP_SUMMARY"
            fi
            # P-651 (2): a PR's head runs no suite, so no green suite is remembered (git has the reuse step).
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
  fast:
    # P-651 (2): the fast checks, once a run, for records and code (was part 1 of job "shard"): on a builder's PR they and
    # job "types" are the whole check; on a merge-queue batch they run beside the parts, and gate B there also runs the
    # rows the batch's PRs name (GATE_B_ONCE). One GitHub machine.
    needs: kind
    if: ${{ needs.kind.outputs.kind != 'notes' && needs.kind.outputs.mode != 'same' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.kind.outputs.suites == 'true' && 90 || 45 }} # a batch's gate B runs packs (as job "packs"); a PR's runs none; cloud-setup.sh's apt wait can take ~7 min (types: 30)
    permissions: { contents: read, pull-requests: read }
    env:
      P: ai-workers/problem-1-pathway-setup-and-form-filling/product
      S: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio
      KIND: ${{ needs.kind.outputs.kind }}
      QUEUE: ${{ needs.kind.outputs.queue }}
      SUITES: ${{ needs.kind.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: the test merge on main (D6, tools/pr-base.sh; kind's main in its own attempt, today's main on a re-run)
        env: { HEAD_SHA: "${{ github.event.pull_request.head.sha || inputs.head }}", KBASE: "${{ needs.kind.outputs.base }}", KATTEMPT: "${{ needs.kind.outputs.battempt }}" }
        run: |
          if [ "$QUEUE" = true ]; then range=$(bash "$P/tools/pr-base.sh" queue)
          else pin=""; [ "$KATTEMPT" = "$GITHUB_RUN_ATTEMPT" ] && pin="$KBASE"; range=$(bash "$P/tools/pr-base.sh" merge "$HEAD_SHA" $pin); fi || exit 1
          echo "RANGE=$range" >> "$GITHUB_ENV"; echo "tested: $range"
      - name: push guard (excluded paths, PDFs, secrets, personal names)
        run: |
          chmod +x "$P/tools/push-guard.sh"
          "$P/tools/push-guard.sh" "$RANGE"
      - name: Mergify scopes match the module cards and the files (check-mergify-scopes.sh; every PR and batch, seconds)
        # P-756 (2) (founder 20 Nov): guards.yml ran it only when tools paths changed, so the PR adding a module folder
        # passed and main went red after it (#2207, #2317). Reads files only. Notes PRs: job "ci". Test: the script itself.
        run: bash "$P/tools/check-mergify-scopes.sh"
      - name: every route a pack's set-up calls has a screen (tools/route-has-screen.mjs, under a second)
        # Founder 5 Nov (P-348; QA-234): green packs hid dead ends, because a pack's set-up calls routes and a person has
        # only screens. A mutating route acceptance/lib/ calls needs a caller in web/src or a reasoned line in
        # tools/route-has-screen-allow.txt. The self-test first proves a new route with neither fails.
        run: node "$P/tools/route-has-screen.mjs" --self-test && node "$P/tools/route-has-screen.mjs"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}   # CI-PRE: a full run (a run of main) saves nothing to main's cache
          cache-dependency-path: ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/package-lock.json
      - name: set up like a cloud session (cloud-setup.sh; the database check-test-dbs.sh and a batch's gate B packs need)
        run: bash "$P/tools/cloud-setup.sh"
      - name: test databases are cleaned up (check-test-dbs.sh; needs the database cloud-setup.sh started)
        run: bash "$P/tools/check-test-dbs.sh"
      - name: records rules, pull requests only (check-docs.sh, decision-impact.sh; ENF-746c, skipped in a merge-queue batch)
        # ENF-746c (P-746, founder 20 Nov): these judge the records (STATE, RULES, DECISIONS: the P-734 lock note, the rule
        # register, decision impact, skill sizes, links), not the code. Each PR passes them before it is queued; in a batch
        # they stopped merges (8 of 13 failed batches, 20 Nov). The code checks stay in the batch. Test: check-queue-run-scope.sh.
        if: env.QUEUE != 'true' && github.event_name != 'merge_group'
        run: |
          bash "$P/tools/check-docs.sh"
          bash "$P/tools/decision-impact.sh"
      - name: graph, official PDFs, explicit-any count, the tools' own checks, && lists, queue-run scope
        run: |
          # One command per line: bash -e passes over a failed command before the last && of a list (P-376 (3), ci-and-lists.mjs).
          bash "$P/tools/check-queue-run-scope.sh"   # ENF-746c: records rules skipped in a batch, every code step still runs
          bash "$P/tools/check-skeleton-scope.sh"   # QA-449: the container proof runs on merge batches, PRs on its paths and dispatch
          node "$P/tools/graph.mjs" --check
          python3 ai-workers/problem-1-pathway-setup-and-form-filling/official-sources/fetch_official_sources.py
          node "$S/tools/count-any.mjs" --against "${RANGE%%..*}"
          bash "$P/tools/check-select-suites.sh"
          bash "$P/tools/check-merge-guard.sh"
          bash "$P/tools/check-lane-bind.sh"
          bash "$P/tools/check-new-machine.sh"   # B168: the any-Mac setup script's own logic
          node "$P/tools/ci-and-lists.mjs"
          node "$P/tools/ci-and-lists.mjs" --self-test
          node "$P/tools/suite-exit.mjs" --self-test   # B160: a suite whose last step is a bare summary() can never fail
          node "$P/tools/suite-exit.mjs"
          bash "$P/tools/check-flaky.sh"
          bash "$P/tools/check-write-token.sh"
          bash "$P/tools/pr-base.sh" --self-test
          node "$S/tools/check-gate-b.mjs"
          node "$S/tools/check-works-set.mjs"
      - name: every port's fake and real adapters run one shared contract (studio/tools/check-port-contracts.mjs, timed)
        # PF-0c (P-606 (8)): a port in studio/ports/ (or identity/port.ts) with a real adapter has
        # ports/contracts/<port>.contract.ts, and every adapter of it, fakes included, calls it in its own test file. The
        # self-test first proves a port with a real adapter and no contract fails (DW1); the guard fails over 10 s (DW4).
        run: |
          node "$S/tools/check-port-contracts.mjs" --self-test
          start=$(date +%s%N)
          node "$S/tools/check-port-contracts.mjs"
          echo "PF-0c DW4: the port-contract guard took $(( ($(date +%s%N) - start) / 1000000 )) ms (limit 10000)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Playwright's own Chromium (a batch's gate B runs packs)
        if: env.KIND == 'code' && env.SUITES == 'true'
        run: cd "$S" && ./node_modules/.bin/playwright install chromium
      - name: gate B, the claimed capabilities' open bugs and acceptance packs (studio/tools/gate-b.mjs)
        # P-214, founder 4 Nov: a code PR's "Claims Works: C<n.n>" capabilities have no open Major or worse in qa/BUGS.md
        # unless it names the bug it fixes; the named capabilities' acceptance packs pass (on the six where the pack's
        # run allows, else "fixture only"). Title and body come in as environment values, never pasted into the script.
        # D2 (P-416, 8 Nov): the named capabilities run here, each on its scoring data (works-set.mjs); the ones the change
        # touches run in job "packs" (GATE_B_NO_DIFF here).
        # P-651 (2): on a PR only its part 1 (the bug check, --no-packs); on a batch every row its PRs name runs, the
        # held ones too (GATE_B_ONCE; P-488), and its packs by diff run in job "packs".
        if: env.KIND == 'code'
        # CI-PRE, a full run: the rows this PR names run with their steps, as on its head before P-651 (QUEUE empty).
        # GATE_B_NOT_TESTED=warn there: gate-b.mjs reads a workflow_dispatch as the nightly's re-test, where NOT TESTED is
        # exit 3; in a batch it is a warning, and a full run must not be red where its batch is green.
        env: { PR_TITLE: "${{ github.event.pull_request.title }}", PR_BODY: "${{ github.event.pull_request.body }}", GITHUB_TOKEN: "${{ github.token }}", GATE_B_NO_DIFF: "1", GATE_B_ONCE: "1", FULL_PR: "${{ inputs.pr }}", GATE_B_NOT_TESTED: "${{ github.event_name == 'workflow_dispatch' && 'warn' || '' }}" }
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FULL_PR" --jq .title) || exit 1
