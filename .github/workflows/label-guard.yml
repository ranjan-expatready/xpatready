# A label never outlives a review (founder, 6 Nov ~03:00 IST: "fix it so that it becomes a hard rule and it never messes
# up"; on 5 Nov #1052 kept `review: approved` across a new fix commit). On every push to a labelled pull request, and
# whenever `review: approved` is added (F4, founder 6 Nov: a label put on a head with no Approve comes off at once, not
# only at the next push), product/tools/label-guard.sh removes the label unless the reviewer's Approve names the new head, or the push is a pure
# merge of main touching none of the PR's files (P-318 (1)), and comments why. pull_request_target runs main's copy of
# this file and the script; the PR's commits are fetched as data and never run. Test: product/tools/check-label-guard.sh.
# B134 (Lead 30 on #1232): a PR's own workflow can label it with GITHUB_TOKEN, and that label starts no run here. But
# Mergify, a GitHub App whose labels do start runs, puts `queued` on about a minute after `review: approved` and merges
# 6 or more minutes later (#1232, #1258, 7 Nov). So when `queued` is added: the job "guard" checks the head's Approve
# as for `review: approved` (whoever put the label on), and the job "sweep" (product/tools/label-sweep.sh) removes any
# `review: approved` that github-actions[bot] put on; the sweep also runs when Mergify opens a batch PR (a PR could put
# `queued` on itself first, so Mergify's own adds no event), every 10 minutes and after each ci run.
# Removing the label takes the PR out of the queue. Main's copy only, as above. Test: check-label-sweep.sh.
name: label-guard
on:
  pull_request_target:
    # opened: Mergify (an App, so its events always start runs) opens a draft batch PR mergify/merge-queue/* before each
    # merge; the sweep runs then too, even if a PR put `queued` on itself first (#1270 breaker, round 2).
    types: [synchronize, labeled, opened]
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: write
# No concurrency group: GitHub would cancel a waiting run, and every run checks the PR's head as it is now, back to its
# last approved commit, so runs are independent (#1136 review M2). A run that fails or times out removes the label.
jobs:
  guard:
    # A push to a labelled PR, the label itself being added, or Mergify's `queued` (B134); other labels start no run.
    if: "contains(github.event.pull_request.labels.*.name, 'review: approved') && (github.event.action == 'synchronize' || github.event.label.name == 'review: approved' || github.event.label.name == 'queued')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: ai-workers/problem-1-pathway-setup-and-form-filling/product/tools
      - name: fetch the pull request's commits (data only)
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - name: label guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          # A labeled event carries no push, so no "after": the PR's head then (the script re-reads it from GitHub anyway).
          AFTER: ${{ github.event.after || github.event.pull_request.head.sha }}
        run: bash ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/label-guard.sh
      - name: the guard could not finish, so the label comes off (fails closed)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 200 removed, 404 not there: anything else fails this step loudly, so a kept label is never silent.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/issues/$PR/labels/review%3A%20approved" || true)
          case "$code" in 200) ;; 404) exit 0;; *) echo "::error::could not remove review: approved (HTTP $code): remove it by hand"; exit 1;; esac
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/issues/$PR/comments" \
            -d '{"body":"**Label guard:** `review: approved` removed because the guard could not finish on this push or label (see the label-guard run). Label again once the head has a reviewer Approve."}' >/dev/null || true
  sweep:
    # B134: no PR labels itself. Main's code only (schedule, workflow_run and pull_request_target all run the default
    # branch's copy); it reads labels and issue events through the API and checks out no pull request.
    if: "github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event.action == 'labeled' && github.event.label.name == 'queued') || (github.event.action == 'opened' && startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/'))"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: label-sweep, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: ai-workers/problem-1-pathway-setup-and-form-filling/product/tools
      - name: "label sweep (review: approved put on by github-actions[bot] comes off)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/label-sweep.sh
