# The eight guards of 6 Nov and B134's label sweep (founder, ~03:00 IST: "make them hard rules"): every test passes, and each test fails with
# its guard switched off (product/tools/check-guards.sh --mutate). Runs only when a guard, its test or a file it reads
# changes; separate from ci.yml (owned by the flow-fix lane) and not a merge condition. About 1 minute, US$0.
name: guards
on:
  pull_request:
    paths:
      - ".claude/settings.json"
      - ".claude/skills/lead/**"
      - ".claude/skills/next/**"
      - ".claude/skills/qa/**"
      - ".github/workflows/comment-run.yml"
      - ".github/workflows/label-guard.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/guards.yml"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/**"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/isolated.sh"
      - "ai-workers/problem-1-pathway-setup-and-form-filling/prototype/studio/tools/test-copies.sh"
permissions:
  contents: read
concurrency:
  group: guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: zsh (isolated.sh is a zsh script)
        # P-214 (11 Nov 2026): when the runner cannot reach Ubuntu's servers, take zsh from the image's Homebrew.
        run: |
          if ! command -v zsh; then
            sudo apt-get update -qq || true
            if ! sudo apt-get install -y -qq zsh; then
              HOMEBREW_NO_AUTO_UPDATE=1 /home/linuxbrew/.linuxbrew/bin/brew install --quiet zsh
              sudo ln -sf "$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)/bin/zsh" /usr/bin/zsh
            fi
          fi
      - name: every guard's test, and each fails without its guard
        run: bash ai-workers/problem-1-pathway-setup-and-form-filling/product/tools/check-guards.sh --mutate
