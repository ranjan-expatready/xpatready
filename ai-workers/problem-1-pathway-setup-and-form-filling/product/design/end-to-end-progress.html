<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave 1 progress</title>
<!--
  End-to-end progress of the Pathway Configurator, Wave 1 (P-101). One template: the Lead edits only the DATA block
  below at every merge or founder decision (same statuses as WAVE-1.md), then commits. The page draws itself.
  Replaces the 26 Oct progress page (its 10 journey steps and "focus: ingestion and extension" are superseded by P-101).
-->
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e4e3de;
--done:#2f7d4f;--built:#5b8def;--agreed:#8e6bd8;--concept:#d9a23a;--research:#c9b48a;--todo:#e7e6e1;--parked:#b9b8b2;--open:#c8553d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#20201f;--ink:#ecebe7;--muted:#a3a29c;--line:#34332f;--todo:#3a3935;--parked:#5a5955}}
:root[data-theme="dark"]{--bg:#171716;--card:#20201f;--ink:#ecebe7;--muted:#a3a29c;--line:#34332f;--todo:#3a3935;--parked:#5a5955}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:32px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend i,.chip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.row{display:grid;grid-template-columns:210px 1fr 230px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{display:block}.row small{color:var(--muted)}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--todo)}
.bar span{display:block;height:100%;border-right:2px solid var(--card)}
.cnt{font-size:13px;color:var(--muted);text-align:right}
.now{border-left:4px solid var(--open);padding:10px 14px;background:var(--card);border-radius:6px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:0}
.chip{white-space:nowrap;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
summary{cursor:pointer;padding:10px 14px;font-weight:600}
details .tw{padding:0 14px 10px;overflow-x:auto}
.id{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:700px){.row{grid-template-columns:1fr}.cnt{text-align:left}th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<main>
<h1>Pathway Configurator: Wave 1 progress</h1>
<p class="sub" id="asof"></p>

<div class="card" id="actors"></div>
<div class="legend" id="legend"></div>

<div id="now"></div>

<h2>Every item</h2>
<div class="card" style="overflow-x:auto"><table id="items"><thead><tr><th>ID</th><th>Item</th><th>Lane</th><th>Status</th></tr></thead><tbody></tbody></table></div>

<h2>Founder asks of 26 Oct, one line each</h2>
<p class="sub" id="askcount"></p>
<div id="asks"></div>
</main>

/* ===================== end of DATA ===================== */

  done:["Merged / done","var(--done)"], built:["Built, merge pending","var(--built)"], agreed:["Agreed, to build","var(--agreed)"],
  concept:["Concept","var(--concept)"], research:["Research / partial","var(--research)"], todo:["Not started","var(--todo)"],
  parked:["Parked","var(--parked)"], decided:["Decided","var(--agreed)"], partial:["Partial","var(--research)"], open:["Open: founder","var(--open)"]
};
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip = k => `<span class="chip"><i style="background:${S[k][1]}"></i>${S[k][0]}</span>`;
const order = ["done","built","agreed","concept","research","todo","parked"];

document.getElementById("asof").textContent = `As of ${DATA.asOf}. ${DATA.focus}`;
document.getElementById("actors").innerHTML = DATA.actors.map(a => {
  const n = k => a.items.filter(i => i[3] === k).length;
  const bar = order.map(k => n(k) ? `<span title="${S[k][0]}: ${n(k)}" style="flex:${n(k)};background:${S[k][1]}"></span>` : "").join("");
  const parts = order.filter(n).map(k => `${n(k)} ${S[k][0].toLowerCase()}`).join(" · ");
  return `<div class="row"><div><b>${esc(a.name)}</b><small>${esc(a.sub)}</small></div><div class="bar">${bar}</div><div class="cnt">${parts}</div></div>`;
}).join("");

document.getElementById("askcount").textContent =

  `<details${g.rows.some(r => r[3] === "open") ? " open" : ""}><summary>${esc(g.group)} (${g.rows.length})</summary><div class="tw"><table><thead><tr><th>#</th><th>Ask</th><th>Where</th><th>Status</th></tr></thead><tbody>${

</html>
