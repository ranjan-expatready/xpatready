.srcbar.on{display:block}
.srcbar b{font-weight:600}
.example{display:inline-block;border:1px dashed var(--wait);color:var(--wait);border-radius:4px;padding:0 6px;font-size:11.5px;margin-left:6px}
.modlist{margin-top:10px}
.dim{opacity:.55}
/* A61-A63 (P-596) */
.strip-in{grid-template-columns:repeat(6,minmax(0,1fr))}
.lineage{max-width:1120px;margin:3px auto 0;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:baseline;flex:none}
.lt-green{background:var(--good)} .lt-amber{background:var(--wait);border-radius:2px;transform:rotate(45deg)} .lt-red{background:var(--bad);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)} .lt-grey{background:transparent;border:1.5px solid var(--none)}
.tile.hl{cursor:pointer}

.banner{border-radius:8px;padding:9px 12px;margin:12px 0 0;font-size:14px;border:1px solid}

#healthPanel{max-height:60vh;overflow:auto;max-width:1120px;margin:6px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}

.ov{display:grid;grid-template-columns:1fr;gap:12px}

@media(min-width:760px){.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;font-size:13px}
.card .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.card .w{font-weight:600;margin:1px 0}
.card .small{font-size:12px;line-height:1.35}
.card.miss{border-color:var(--wait);box-shadow:inset 3px 0 0 var(--wait)}

.wmark.rep{background:transparent;border:1.5px solid var(--accent);padding:0;margin-left:6px;width:8px;height:8px;border-radius:50%}

@media(max-width:760px){.strip-in{grid-template-columns:repeat(3,minmax(0,1fr))}}

<script>
(function(){
"use strict";
var D=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function v(x){return x&&typeof x==="object"&&"v" in x?x.v:x;}
function src(x){return x&&typeof x==="object"&&x.src?x.src:"";}
function S(s){return s?' data-src="'+esc(s)+'" title="'+esc(s)+'"':"";}
function nz(x,suf){return x==null?'<span class="muted">n/a</span>':esc(x)+(suf||"");}
function fmtDate(iso){if(!iso)return "not dated";var d=new Date(iso+"T00:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
function short(iso){if(!iso)return "not dated";var d=new Date(iso+"T00:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
var LABEL={"Not shaped":"Not yet specified","Shaped":"Specified, ready to build","In PR":"In development","Merged":"Built","qa Works":"Proven","Works":"Proven","Built, awaiting qa":"Built, not yet proven","Partial":"Partly working","Not tested":"Not yet tested","Not built":"Not yet built"};

function pill(text,tone,s){return '<span class="pill t-'+tone+'"'+S(s)+'>'+esc(lab(text))+'</span>';}
var TONE={"qa Works":"good","Merged":"prog","In PR":"prog","Shaped":"wait","Not shaped":"none",
  "Works":"good","Built, awaiting qa":"prog","Partial":"wait","Not tested":"none","Broken":"bad","Not built":"none",
  "Merge queue":"good","Ready for label":"prog","Building":"prog","Concept":"none","CI running":"prog","CI red":"bad","Question to Lead":"wait",
  "pushing":"good","quiet":"wait","blocked":"bad","ready":"good","in PR":"prog","merged":"good"};
function tone(s){return TONE[s]||"none";}
function toneVar(t){return "var(--"+t+")";}
function ageText(h){if(h==null)return "n/a";if(h<0)h=0;if(h<1)return Math.round(h*60)+" min";if(h<48)return (Math.round(h*10)/10)+" h";return Math.round(h/24)+" d";}

function kpi(label,val,sub,s,cls){return '<div class="kpi'+(cls?" "+cls:"")+'"'+S(s)+'><div class="k">'+esc(label)+'</div><div class="v">'+val+'</div>'+(sub?'<div class="s">'+sub+'</div>':"")+'</div>';}

/* source bar on tap */
var bar=document.getElementById("srcbar"),barT=null;
document.addEventListener("click",function(e){
  var go=e.target.closest("[data-go]");
  if(go){e.preventDefault();var tb=document.querySelector('.tabs button[data-tab="'+go.getAttribute("data-go")+'"]');if(tb){tb.click();var tg=document.getElementById("trust");if(tg)tg.scrollIntoView();}return;}
  var el=e.target.closest("[data-src]");

  bar.innerHTML="<b>Source:</b> "+esc(el.getAttribute("data-src"));
  bar.classList.add("on");clearTimeout(barT);barT=setTimeout(function(){bar.classList.remove("on");},7000);
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("data-mod")){e.preventDefault();showModule(e.target.getAttribute("data-mod"));}
});

function dataAgeH(){return D?(Date.now()-Date.parse(D.freshness.generated_at))/3600000:null;}
/* Health item 2, the one number the page computes (spec §0.5): data age from generated_at and the viewer's clock */
function ageState(h){var r=(D.freshness.page_age_rule||{amber_min:45,red_min:120});return h==null?"amber":h*60>=r.red_min?"red":h*60>=r.amber_min?"amber":"green";}
function worst(a,b){var o={red:3,amber:2,green:1,grey:0};return (o[a]||0)>=(o[b]||0)?a:b;}
function dot(st){return '<span class="dot lt-'+esc(st||"grey")+'" aria-hidden="true"></span>';}
var LIGHTWORD={green:"green",amber:"amber",red:"red",grey:"grey",page:"page"};
/* a number with lineage {value,src,sha,as_of,class,reason}: "not measured" with its reason, never a guess */
function srcN(n){if(!n)return "";return [n.src,n.sha?"sha "+n.sha:"",n.as_of?"as of "+n.as_of:"",n["class"]||"",n.reason?"reason: "+n.reason:""].filter(Boolean).join(" · ");}
function nm(reason){return '<span class="nm"'+S(reason||"not measured")+'>not measured</span>';}
function N(n,suf,fmt){if(!n)return nm("missing from data.json");if(n.value==null)return nm(n.reason);var t=fmt?fmt(n.value):esc(n.value)+(suf||"");return '<span'+S(srcN(n))+'>'+t+'</span>'+(n["class"]==="reported"?'<span class="rep">Lead-reported</span>':"");}
function dshort(x){return x&&/^\d{4}-/.test(x)?short(x):esc(x);}

/* lineage of a legacy {v,src,sha,as_of,class} value, for hover and the source bar (principle 3) */
function srcV(x){if(!x||typeof x!=="object")return "";return [x.src,x.sha?"sha "+x.sha:"",x.as_of?"as of "+x.as_of:"",x["class"]||""].filter(Boolean).join(" \u00b7 ");}
function relTile(){var P=D.pace;if(!P)return '<div class="tile"><div class="k">Release 1</div><div class="v">n/a</div></div>';
  var b=P.built,pr=P.proven,diff=((D.trust||{}).status_disagreements||[]).length;

  var miss=function(label,n){nms.push('<span class="nm"'+S(label+": "+(n&&n.reason||"missing from data.json"))+'>'+esc(label)+'</span>');};
  var least=U.at_least?"at least ":"";

  if(U.value!=null)parts.push(least+val(U,"%")+' of a weekly plan used<span class="rep">Lead-reported</span>');else miss("weekly plan used",U);

  else parts.push(val(Wr)+' row'+(Wr.value===1?"":"s")+' reached qa Works'+per(Wr,X.pct_per_works_row,"row","rows","plan % per row"));
  var rd=[];

  if(RN.value!=null)rd.push('needed '+val(RN));else miss("rows needed a day",RN);

}

  var one=function(f){try{return f();}catch(e){return '<section><p class="err">This block could not be drawn: '+esc(e.message)+'</p></section>';}};
  var cur="overview";try{var sv=localStorage.getItem("board-tab");if(sv&&TABS.some(function(t){return t[0]===sv;}))cur=sv;}catch(e){}
  var out=one(rBanner)+'<p class="goal">Goal: Release 1 (production grade), complete and end to end, ready for the first real firm\'s data after the launch gate (P-570, P-589, P-594).</p>'+one(rNeeds);
  out+='<div class="tabs" role="tablist">'+TABS.map(function(t){return '<button role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(t[0]===cur)+'">'+esc(t[1])+'</button>';}).join("")+'</div>';
  TABS.forEach(function(t){out+='<div class="tabpanel" role="tabpanel" data-panel="'+t[0]+'"'+(t[0]===cur?'':' hidden')+'>';t[2].forEach(function(f){out+=one(f);});out+='</div>';});
  document.getElementById("body").innerHTML=out;
  document.querySelectorAll(".tabs button").forEach(function(b){b.addEventListener("click",function(){var id=b.getAttribute("data-tab");
    document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",String(x===b));});
    document.querySelectorAll(".tabpanel").forEach(function(p){p.hidden=p.getAttribute("data-panel")!==id;});
    try{localStorage.setItem("board-tab",id);}catch(e){}
    drawAll();});});
  document.querySelectorAll("details").forEach(function(dd){dd.addEventListener("toggle",drawAll);});
  drawAll();
}
function drawAll(){[drawVSM,drawArch,drawBurnup,drawTimeline].forEach(function(f){try{f();}catch(e){}});}
var rt=null;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(D){drawAll();}},150);});
setInterval(function(){if(D)renderStrip();},60000);

fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
.then(function(d){D=d;render();})
.catch(function(e){
  document.getElementById("stripIn").innerHTML='<div class="tile alert" style="grid-column:1/-1"><div class="k">Data</div><div class="v">not loaded</div></div>';
  document.getElementById("body").innerHTML='<div class="err"><b>The board could not load its data (data.json).</b><br>'+esc(e.message)+'<br>Run <span class="mono">python3 product/tools/cockpit-data.py --out &lt;folder&gt;/data.json</span> and publish data.json next to this page. Nothing on this page is shown without it.</div>';
});
})();
</script>
