<!DOCTYPE html>
<!-- Sample · Scaffolding (P-33), F2c: the blank s1 screen (same structure as imm5257-online-s1-personal.html) whose page
     script refuses one value, as a portal may (it clears "Another gender" and the birth country "PHL" right after they are
     chosen), so the extension's read-back has something to catch (BR-11). Not a real IRCC screen. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Personal details - Application for a visitor visa - IRCC Portal</title>
</head>
<body>
  <main>
    <h1>Personal details</h1>
    <form id="application" method="post" action="/application/visitor/personal">
      <input type="hidden" name="_csrf" value="k3J9-session-7f1c2a">
      <fieldset>
        <legend>Full name</legend>
        <label for="familyName">Family name (as shown on your passport or travel document) <span class="req">(required)</span></label>
        <input type="text" id="familyName" name="familyName" maxlength="100" required>
        <label for="givenNames">Given name(s) (as shown on your passport or travel document)</label>
        <input type="text" id="givenNames" name="givenNames" maxlength="100" aria-describedby="givenNamesHelp">
        <p id="givenNamesHelp">Leave blank if you have no given name on your passport.</p>
      </fieldset>
      <label for="uci">UCI</label>
      <input type="text" id="uci" name="uci" maxlength="10" pattern="[0-9]{8,10}" aria-describedby="uciHelp">
      <p id="uciHelp">Your unique client identifier, if you have one. It is on letters from IRCC.</p>
      <label for="sex">Sex</label>
      <select id="sex" name="sex" required>
        <option value="">Select one</option>
        <option value="FEMALE">Female</option>
        <option value="MALE">Male</option>
        <option value="ANOTHER">Another gender</option>
        <option value="UNKNOWN">Unknown</option>
      </select>
      <fieldset>
        <legend>Date of birth</legend>
        <label for="dobYear">Year</label><input type="text" id="dobYear" name="dobYear" maxlength="4" required>
        <label for="dobMonth">Month</label>
        <select id="dobMonth" name="dobMonth" required><option value="">--</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
        <label for="dobDay">Day</label><input type="text" id="dobDay" name="dobDay" maxlength="2" required>
      </fieldset>
      <fieldset>
        <legend>Place of birth</legend>
        <label for="birthCity">City or town</label><input type="text" id="birthCity" name="birthCity" required>
        <label for="birthCountry">Country or territory</label>
        <select id="birthCountry" name="birthCountry" required><option value="">Select one</option><option value="IND">India</option><option value="PHL">Philippines</option><option value="CHN">China</option></select>
      </fieldset>
      <button type="submit">Save and continue</button>
    </form>
    <script>
      // The portal's own check: it does not keep two of the choices (the read-back must notice).
      for (const [id, refused] of [["sex", "ANOTHER"], ["birthCountry", "PHL"]]) document.getElementById(id).addEventListener("change", (e) => { if (e.target.value === refused) e.target.value = ""; });
      document.getElementById("application").addEventListener("submit", (e) => { e.preventDefault(); window.__submitted = (window.__submitted || 0) + 1; });
    </script>
  </main>
</body>
</html>
