<!DOCTYPE html>

     The reader cannot look into it, so it must say "not read" rather than send the screen without those questions. -->
<html lang="en"><head><meta charset="utf-8"><title>Payment details - APR Portal</title></head>
<body><main><h1>Payment details</h1>
<form id="aprApplication"><label for="payer">Name of the person paying</label><input type="text" id="payer" name="payer">
<iframe title="Card details" src="https://payments-widget.sample.invalid/card" width="420" height="160"></iframe>
<button type="submit">Save and continue</button></form></main></body></html>
