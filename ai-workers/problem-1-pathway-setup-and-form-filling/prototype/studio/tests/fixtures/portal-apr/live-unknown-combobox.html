<!DOCTYPE html>
<!-- Sample · Scaffolding (P-98): a custom drop-down (role="combobox") instead of a select. Its question and its choices
     are not in the page's form controls, so the reader must say "not read". -->
<html lang="en"><head><meta charset="utf-8"><title>Address - APR Portal</title></head>
<body><main><h1>Address</h1>
<label for="street">Street address</label><input type="text" id="street" name="street">
<div role="combobox" aria-label="Country or territory" aria-expanded="false" tabindex="0">Select one</div>
<button type="submit">Save and continue</button></main></body></html>
