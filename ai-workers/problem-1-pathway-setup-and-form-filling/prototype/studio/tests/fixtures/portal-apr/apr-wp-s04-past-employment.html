<!DOCTYPE html>
<!-- Sample · Scaffolding (P-33, P-98). Written by the forms lane to look like a blank screen of an application on the
     Authorized Paid Representatives (APR) Portal. Not a real APR screen: nobody has seen one yet (the founder captures the
     real blank screens in G3). Labels follow IRCC's public descriptions of the form; the markup differs from the IRCC
     Portal Sample on purpose (aria-labelledby, a step list, a representative banner, a sign-out form). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="apr-sess-41d9">
  <title>Employment in the past 10 years - Application for a work permit made outside of Canada - APR Portal</title>
  <script>window.__apr = { step: 4, total: 5 };</script>
</head>
<body>
  <header>
    <p class="banner">Authorized Paid Representatives Portal (Sample)</p>
    <nav aria-label="Portal"><a href="/apr/dashboard">My applications</a> <a href="/apr/help">Help</a> <a href="/apr/fr" lang="fr">Français</a></nav>
    <form role="search" action="/apr/search"><label for="aprSearch">Search applications</label><input type="search" id="aprSearch" name="q"></form>
  </header>
  <main>
    <ol class="steps" aria-label="Application steps"><li>Application details</li><li>Personal details</li><li>Proposed job in Canada</li><li aria-current="step">Employment in the past 10 years</li><li>Education</li></ol>
    <h1>Employment in the past 10 years</h1>
    <form id="aprApplication" method="post" action="/apr/application/work-permit">
      <input type="hidden" name="_csrf" value="apr-sess-41d9">
      <input type="hidden" name="draftId" value="D-000000">
      <div class="field"><span id="pastOccupationLabel" class="label">Occupation <span class="req">(required)</span></span>
        <input type="text" id="pastOccupation" name="pastOccupation" aria-labelledby="pastOccupationLabel" maxlength="100" required></div>
      <div class="field"><span id="pastEmployerLabel" class="label">Company or employer</span>
        <input type="text" id="pastEmployer" name="pastEmployer" aria-labelledby="pastEmployerLabel" maxlength="200"></div>
      <fieldset><legend>From</legend>
        <label for="pastFromYear">Year</label><input type="text" id="pastFromYear" name="pastFromYear" maxlength="4">
        <label for="pastFromMonth">Month</label><select id="pastFromMonth" name="pastFromMonth"><option value="">--</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
        <label for="pastFromDay">Day</label><input type="text" id="pastFromDay" name="pastFromDay" maxlength="2">
      </fieldset>
      <fieldset><legend>To</legend>
        <label for="pastToYear">Year</label><input type="text" id="pastToYear" name="pastToYear" maxlength="4">
        <label for="pastToMonth">Month</label><select id="pastToMonth" name="pastToMonth"><option value="">--</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
        <label for="pastToDay">Day</label><input type="text" id="pastToDay" name="pastToDay" maxlength="2">
      </fieldset>
      <div class="actions"><button type="button" name="back">Back</button> <button type="submit" name="next">Save and continue</button></div>
    </form>
  </main>
  <footer><form action="/apr/signout" method="post"><button type="submit">Sign out</button></form></footer>
</body>
</html>
