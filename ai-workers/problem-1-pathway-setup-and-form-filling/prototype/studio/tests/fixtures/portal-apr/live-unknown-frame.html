<!DOCTYPE html>
<!-- Sample · Scaffolding (P-98): the screen's questions sit inside a frame of the same site. The extension reads the top
     page only, so the reader must say "not read", never send the heading without its questions. -->
<html lang="en"><head><meta charset="utf-8"><title>Travel history - APR Portal</title></head>
<body><main><h1>Travel history</h1>
<label for="note">Anything else we should know</label><input type="text" id="note" name="note">
<iframe title="Trips" srcdoc="<form><label for='trip'>Country visited</label><input id='trip' name='trip'><label for='tripYear'>Year</label><input id='tripYear' name='tripYear'></form>"></iframe>
</main></body></html>
