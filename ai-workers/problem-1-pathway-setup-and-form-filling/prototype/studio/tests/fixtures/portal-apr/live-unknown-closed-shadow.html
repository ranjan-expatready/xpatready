<!DOCTYPE html>
<!-- Sample · Scaffolding (P-98, break 26 Oct): a question inside a closed page component beside a normal one. A page's
     own script cannot see into a closed component, but the extension can: the reader must say "not read". -->
<html lang="en"><head><meta charset="utf-8"><title>Contact details - APR Portal</title></head>
<body><main><h1>Contact details</h1>
<form id="aprApplication"><label for="phone">Telephone number</label><input type="text" id="phone" name="phone">
<apr-closed data-label="Email address"></apr-closed><button type="submit">Save and continue</button></form></main>
<script>
customElements.define("apr-closed", class extends HTMLElement {
  connectedCallback() { const r = this.attachShadow({ mode: "closed" }); r.innerHTML = `<label for="f">${this.dataset.label}</label><input id="f" type="text">`; }
});
</script></body></html>
