<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Assistants Prototype</title>
<meta name="description" content="Clickable prototype of Expat Ready's firm AI assistants, built from AW-01 v0.5 and AW-02 v0.6 (11 Oct 2026). Illustrative only; fictional data.">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e8ebf0;
  --text:#141821; --muted:#555f6e; --faint:#828b99; --border:#e2e5ea; --border-strong:#cfd4dc;
  --accent:#2c56c9; --accent-ink:#ffffff; --accent-soft:#e9effc;
  --ok:#17744a; --ok-soft:#e2f3e9; --warn:#9a5600; --warn-soft:#fcf0dc;
  --danger:#b3261e; --danger-soft:#fce7e5; --ai:#6440b8; --ai-soft:#eee8fa;
  --paused:#8a5a00; --paused-soft:#fbefd6;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:12px; --radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161a22; --surface-2:#1b2029; --surface-3:#232934;
    --text:#e6e9ef; --muted:#a2abb9; --faint:#79828f; --border:#2a303b; --border-strong:#39404d;
    --accent:#7fa3ff; --accent-ink:#0e1117; --accent-soft:#1c2843;
    --ok:#5cc690; --ok-soft:#13301f; --warn:#f0b55e; --warn-soft:#382912;
    --danger:#ff8c82; --danger-soft:#3b1a18; --ai:#b9a0ff; --ai-soft:#271f3f;
    --paused:#f0b55e; --paused-soft:#352712;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface-2:#1b2029; --surface-3:#232934;
  --text:#e6e9ef; --muted:#a2abb9; --faint:#79828f; --border:#2a303b; --border-strong:#39404d;
  --accent:#7fa3ff; --accent-ink:#0e1117; --accent-soft:#1c2843;
  --ok:#5cc690; --ok-soft:#13301f; --warn:#f0b55e; --warn-soft:#382912;
  --danger:#ff8c82; --danger-soft:#3b1a18; --ai:#b9a0ff; --ai-soft:#271f3f;
  --paused:#f0b55e; --paused-soft:#352712;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
code,.code{font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand-name{font-weight:650;font-size:14px}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:8px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .num{width:20px;height:20px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;color:var(--muted)}
.nav button[aria-current="page"] .num{background:var(--accent);color:var(--accent-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.mini-toggle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.main{min-width:0;padding:28px clamp(16px,4vw,44px) 60px}
.topbar{display:none}

/* ---------- common ---------- */
.screen{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.page-head{display:flex;flex-direction:column;gap:8px}
.page-head h1{font-size:26px;font-weight:700}
.lead{color:var(--muted);max-width:760px}
.scenario{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--muted)}
.scenario b{color:var(--text);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card-head h2{font-size:17px;font-weight:650}
.card-head h3{font-size:15px;font-weight:650}
.section{padding:16px 20px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:0}
.section h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:10px;font-weight:650}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2.split-l{grid-template-columns:minmax(0,310px) minmax(0,1fr)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.xs{font-size:12px}
.sep{height:1px;background:var(--border);margin:6px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.paused{background:var(--paused-soft);color:var(--paused)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.outline{background:transparent;border:1px solid var(--border-strong)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--text);min-height:38px}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 8px;min-height:auto}
.btn.sm{padding:5px 10px;font-size:13px;min-height:30px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,.seg button:focus-visible,.switch:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.switch{position:relative;width:40px;height:23px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(17px)}
.switch:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.notice{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.notice.info{background:var(--accent-soft);color:var(--text)}
.notice.ok{background:var(--ok-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.paused{background:var(--paused-soft)}
.notice.danger{background:var(--danger-soft)}
.notice .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.notice.info .ic{background:var(--accent);color:var(--accent-ink)}
.notice.ok .ic{background:var(--ok);color:var(--surface)}
.notice.warn .ic,.notice.paused .ic{background:var(--warn);color:var(--surface)}
.notice.danger .ic{background:var(--danger);color:var(--surface)}
.tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.low td{background:color-mix(in srgb,var(--warn-soft) 70%,transparent)}
tr.low.opened td{background:transparent}
.conf{font-family:var(--mono);font-size:12.5px}
.conf.lowc{color:var(--warn);font-weight:700}
.src-box{margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.src-img{height:54px;border-radius:6px;margin-top:6px;background:repeating-linear-gradient(135deg,var(--surface-3) 0 8px,var(--surface) 8px 16px);display:grid;place-items:center;font-size:11.5px;color:var(--faint);border:1px solid var(--border)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.check.done .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check.done .t{color:var(--muted)}
.ai-block{border-left:3px solid var(--ai);background:var(--ai-soft);border-radius:0 8px 8px 0;padding:10px 12px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--faint);padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.step .n{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:11px}
.step.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--accent-soft)}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.past{color:var(--ok)}
.step.past .n{background:var(--ok);color:var(--surface)}
.keylist{display:flex;flex-direction:column;gap:2px}
.keyrow{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:7px}
.keyrow:hover{background:var(--surface-2)}
.keyrow input{margin-top:3px;flex:none}
.keyrow.never{opacity:.62}
.keyrow.never .lock{flex:none;width:16px;text-align:center;margin-top:1px;color:var(--faint)}
.keyrow .k{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.keyrow .why{font-size:12.5px;color:var(--muted)}
.audit{display:flex;flex-direction:column;gap:0;font-size:13px}
.audit div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.audit div:last-child{border-bottom:0}
.audit time{color:var(--faint);font-family:var(--mono);font-size:12px}
.item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.item-top{padding:14px 18px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.item-top:hover{background:var(--surface-2)}
.item-title{font-weight:650;font-size:15.5px}
.item-meta{font-size:13px;color:var(--muted);margin-top:3px}
.chev{flex:none;color:var(--faint);transition:transform .15s;margin-top:4px}
.item[data-open="true"] .chev{transform:rotate(90deg)}
.foot{margin-top:6px;border-top:1px solid var(--border);padding-top:12px;font-size:12px;color:var(--faint);line-height:1.6}
.foot b{font-weight:600;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap;font-weight:400;letter-spacing:0;text-transform:none}
body.hide-tags .tag{display:none}
.illus{font-size:11px;font-style:italic;color:var(--faint)}
.answer-line{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.answer-line:last-child{border-bottom:0}
.menu-q{display:flex;flex-direction:column;gap:6px}
.menu-q button{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.menu-q button:hover{border-color:var(--border-strong)}
.menu-q button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.menu-q .qn{width:22px;height:22px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted)}
.cand{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.cand.exact{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.cand .amt{font-family:var(--mono);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--border)}
.setrow{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:0}
.setrow .t{font-weight:600}
.setrow .d{font-size:13px;color:var(--muted);margin-top:2px}
.vals td input{width:110px}
.err{color:var(--danger);font-size:12.5px;margin-top:4px}
.okmsg{color:var(--ok);font-size:12.5px;margin-top:4px}
.locked-box{display:flex;gap:14px;align-items:flex-start}
.lock-ic{width:38px;height:38px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;flex:none;font-size:17px}
.demo{border:1px dashed var(--ai);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--ai-soft) 55%,transparent)}
.demo .lbl{color:var(--ai)}
.about p+p{margin-top:10px}
.about ul{margin:6px 0 0 18px;padding:0}
.about li{margin:4px 0}
.prov-row{cursor:pointer}
.prov-row:hover td{background:var(--surface-2)}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ba > div{border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;background:var(--surface-2)}
.ba .lbl{display:block;margin-bottom:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* ---------- phone ---------- */
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px 10px}
  .topbar .brand{padding:0}
  .topnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .topnav::-webkit-scrollbar{display:none}
  .topnav button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .topnav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .main{padding:18px 16px 48px}
  .page-head h1{font-size:22px}
  .grid2,.grid2.split-l,.ba{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .audit div{grid-template-columns:minmax(0,1fr);gap:2px}
  .card-pad,.section,.card-head,.setrow{padding-left:14px;padding-right:14px}
  .item-top{padding:12px 14px}
  .setrow{flex-direction:column}
}
.topbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Prototype navigation">
    <div class="brand"><div class="brand-mark">ER</div><div><div class="brand-name">AI Assistants</div><div class="brand-sub">Firm F · prototype</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="mini-toggle"><span>Requirement tags</span><button class="switch" role="switch" aria-checked="true" data-act="tags" aria-label="Show requirement tags on elements"></button></div>
      <div class="mini-toggle" style="flex-direction:column;align-items:flex-start"><span>Theme</span><div class="seg" id="theme-seg-side"></div></div>
    </div>
  </aside>
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><div class="brand-mark">ER</div><div><div class="brand-name">AI Assistants</div><div class="brand-sub">Firm F · prototype</div></div></div>
      <div class="row" style="gap:8px"><span class="xs muted">IDs</span><button class="switch" role="switch" aria-checked="true" data-act="tags" aria-label="Show requirement tags on elements"></button><div class="seg" id="theme-seg-top"></div></div>
    </div>
    <nav class="topnav" id="topnav" aria-label="Screens"></nav>
  </div>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";

/* =============================== helpers =============================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag = t => `<span class="tag">${t}</span>`;
const ill = (t='illustrative') => `<span class="illus">${t}</span>`;
const nowStamp = () => { const d=new Date(); return d.toTimeString().slice(0,5); };
const pct = n => Math.round(n*100) + '%';
function foot(ids, extra){
  return `<div class="foot"><b>Traces to:</b> ${ids}${extra?`<br>${extra}`:''}</div>`;
}

/* =============================== state =============================== */
const S = {
  screen: 'needs',
  tags: true,
  theme: 'auto',
  needs: { open:{report:true, paused:false}, opened:{}, srcOpen:null, holdout:'', holdoutResult:null,
           report:'pending', reportAt:null, rejecting:false, rejectReason:'', someNote:false,
           alarmSeen:false, viewAs:'approver', paused:'paused', pausedRejecting:false },

function dlPerson(){ const a=A[S.dl.assistant]; return a.persons[S.dl.person] || Object.values(a.persons)[0]; }
function dlMay(){ const a=A[S.dl.assistant]; return (S.dl.assistant==='firm' && S.dl.person==='cm') ? a.cmMay : a.may; }
function dlInitKeys(){ const k={}; dlMay().forEach(g=>g[1].forEach(x=>k[x[0]]=true)); S.dl.keys=k; }
function dlLog(text){ S.dl.log.unshift({t:nowStamp(), text}); }

function screenDeleg(){
  const d = S.dl, a = A[d.assistant], p = dlPerson();
  if(!d.keys) dlInitKeys();
  const order = ['setup','pending','active','ended'];
  const labels = {setup:'Set up', pending:'Pending acceptance', active:'Active', ended:'Ended'};
  const cur = d.state==='paused' ? 'active' : d.state;
  const ci = order.indexOf(cur);
  const steps = order.map((s,i)=>`<span class="step ${i<ci?'past':''} ${i===ci?'on':''}"><span class="n">${i<ci?'✓':i+1}</span>${labels[s]}${s==='active'&&d.state==='paused'?' · paused':''}</span>`).join('');

  const head = `
  <div class="page-head">
    <div class="eyebrow">Screen 2 of 6</div>
    <h1>Set up an assistant for a person</h1>
    <p class="lead">An assistant works for one named person, with a subset of that person's own permissions. It runs only after that person accepts. Only that person can end it. ${tag('AW-1-5')}${tag('AW-1-6')}</p>
  </div>
  <div class="scenario"><span>◇</span><div><b>Scenario.</b> Firm F, AI on. The Owner opens an assistant's settings page and sets one up for a staff member. Use <b>Viewing as</b> to switch between the Owner and the named person. Fictional.</div></div>
  <div class="row" style="justify-content:space-between">
    <div class="steps">${steps}</div>
    <div class="seg" role="group" aria-label="Viewing as">
      <button data-act="d-view" data-v="owner" aria-pressed="${d.viewAs==='owner'}">The Owner</button>
      <button data-act="d-view" data-v="person" aria-pressed="${d.viewAs==='person'}">${esc(p.label[0].toUpperCase()+p.label.slice(1))}</button>
    </div>
  </div>`;

  let body = '';
  if(d.state==='setup'){
    if(d.viewAs==='person'){
      body = `<div class="card card-pad"><p class="muted">Nothing has been offered to ${esc(p.label)} yet. A person may also set up their own assistant. ${tag('AW-1-6')}</p></div>`;
    } else body = setupCard();
  } else {
    body = statusCard();
  }

  const audit = d.log.length ? `
  <div class="card"><div class="card-head"><h3>Audit trail ${tag('AW-1-6')}${tag('AG-13-68')}</h3><span class="small muted">every act on a delegation is audited</span></div>
  <div class="card-pad"><div class="audit">${d.log.map(l=>`<div><time>${l.t}</time><span>${l.text}</span></div>`).join('')}</div></div></div>` : '';

  return head + body + audit + foot('AW-1-5, AW-1-6, AW-1-7, AW-1-8, AW-1-9, AW-1-10, AW-1-11, AW-1-12, AW-1-20, AW-1-37, AW-1-47, AW-1-111, AW-1-125; AW1-D2, AW1-D34; AW1-BR-3, AW1-BR-4, AW1-BR-23; §6 Delegation states; §7 Delegation; §10 delegation subsets; SA-6-44 (CN-SA-06 change 1); AG-6-46 (CN-AG-06 change 6); AG-11-112(e)(f); US-1, US-2, US-3, US-111, US-113, US-114.');
}

  return `
  <div class="card">

      <div class="field"><label for="d-person">For this person</label><select id="d-person" data-act="d-person">${personOpts}</select><span class="xs faint">Licence: ${esc(p.licensed)}. Information only; it never gates a delegation. ${tag('AW-1-7')}</span></div>
    </div>

        <dt>Valid from</dt><dd>When ${esc(p.label)} accepts · no end date ${ill('(an optional end date is allowed)')}</dd>
        <dt>Taken from</dt><dd>The <b>${esc(p.role)}</b> column of the firm's permissions, key by key, lendable keys only. Never more than the person holds at the moment of acting. ${tag('AW-1-8')}${tag('AW-1-10')}</dd>
      </dl>
    </div>
    <div class="section">
      <h4>2 · Permissions the assistant may use ${d.assistant==='expert'?'':`· ${count} of ${total} ticked`} ${tag('SA-6-44')}</h4>

    <div class="section">
      <h4>Never lent to an assistant · shown for your information ${tag('AW-1-9')}</h4>
      <p class="small muted" style="margin-bottom:8px">The server refuses these at set-up and again at every action. They cannot be ticked.</p>
      <div class="keylist">${neverHtml}</div>

}

function statusCard(){
  const d = S.dl, a = A[d.assistant], p = dlPerson();
  const P = p.label[0].toUpperCase()+p.label.slice(1);
  const stateMap = {
    pending:'<span class="pill accent"><span class="dot"></span>PENDING_ACCEPTANCE</span>',
    active:'<span class="pill ok"><span class="dot"></span>ACTIVE</span>',
    paused:'<span class="pill paused"><span class="dot"></span>PAUSED · ASSISTANT_SWITCH_OFF</span>',
    ended:'<span class="pill"><span class="dot"></span>ENDED</span>'
  };
  const count = d.assistant==='expert' ? 0 : Object.values(d.keys).filter(Boolean).length;
  const summary = `
  <div class="section"><dl class="kv">
    <dt>Assistant</dt><dd>${esc(a.name)} · “${esc(a.screen)}”</dd>
    <dt>Works for</dt><dd>${esc(p.label)} (${esc(p.role)}) · licence ${esc(p.licensed)}, information only</dd>
    <dt>Permissions</dt><dd>${d.assistant==='expert'?'none stored (summary line only)':count+' lendable keys, listed one by one'}</dd>
    <dt>Scope</dt><dd>${esc(a.scope)}</dd>
    <dt>Set up by</dt><dd>the Owner</dd>
    ${d.endReason?`<dt>End reason</dt><dd><code>${d.endReason}</code></dd>`:''}
  </dl></div>`;

  let actions = '', note = '';
  if(d.state==='pending'){
    if(d.viewAs==='owner'){
      note = `<div class="notice info"><span class="ic">i</span><div class="small">Waiting for ${esc(p.label)} to accept. While it is still pending, you may withdraw the offer: it never took effect. ${tag('AW-1-6')}${tag('US-114')}</div></div>`;
      actions = `<button class="btn danger" data-act="d-withdraw">Withdraw offer</button>`;
    } else {
      note = `<div class="notice info"><span class="ic">i</span><div class="small">The Owner offered you ${esc(a.name.toLowerCase())}. Review the permissions it would use on your behalf. Every act it prepares will name you as the person behind it. ${tag('AW-1-3')}</div></div>`;
      actions = `<button class="btn primary" data-act="d-accept">Accept</button><button class="btn" data-act="d-decline">Decline</button>`;
    }
  } else if(d.state==='active' || d.state==='paused'){
    const waitingPill = d.waiting==='pending' ? '<span class="pill accent">pending</span>' : d.waiting==='paused' ? '<span class="pill paused">paused</span>' : d.waiting==='stale' ? '<span class="pill warn">stale · needs fresh approval</span>' : '';
    const waitLine = a.waiting ? `<div class="small" style="margin-top:8px">Waiting from this delegation: ${esc(a.waiting)} ${waitingPill} ${ill('(fictional)')}</div>` : '';
    if(d.viewAs==='owner'){
      note = `<div class="notice ${d.state==='paused'?'paused':'ok'}"><span class="ic">${d.state==='paused'?'ǁ':'✓'}</span><div class="small">
        ${d.state==='paused' ? `Paused because you switched ${esc(a.name.toLowerCase())} off for the firm. It resumes with no new acceptance when you switch it on. ${tag('AW-1-11(a)')}${tag('AW-1-125')}` : `Accepted by ${esc(p.label)}. The assistant now prepares work for ${esc(p.label)}.`}
        <div style="margin-top:6px"><b>You have no control to end this.</b> Only ${esc(p.label)} can end it. To halt the assistant at once, use its switch or the AI switch, or deactivate the person. ${tag('AW-1-6')}${tag('AW1-D34')}</div>${waitLine}</div></div>`;
      actions = `<div class="row" style="gap:10px"><span class="small muted">${esc(a.name)} switch for the firm</span><button class="switch" role="switch" aria-checked="${d.switchOn}" data-act="d-switch" aria-label="${esc(a.name)} switch"></button>${tag('AG-16-57')}</div>`;
    } else {
      note = `<div class="notice ${d.state==='paused'?'paused':'ok'}"><span class="ic">${d.state==='paused'?'ǁ':'✓'}</span><div class="small">${d.state==='paused'?'Your assistant is paused by a firm switch. You do not need to accept again.':'Your assistant is active.'}${waitLine}</div></div>`;
      actions = d.confirmEnd
        ? `<div class="stack"><p class="small">Ending is final. Anything it has waiting will be cancelled and stay visible in the audit. A later assistant needs a new acceptance.</p><div class="row"><button class="btn danger" data-act="d-end-confirm">End my delegation</button><button class="btn" data-act="d-end-cancel">Keep it</button></div></div>`
        : `<button class="btn danger" data-act="d-end">End my delegation</button>`;
    }
  } else if(d.state==='ended'){
    const reasonText = {WITHDRAWN:'The Owner withdrew the offer before it was accepted. Nothing ran under it.', DECLINED:`${P} declined. Nothing ran under it.`, PERSON_ENDED:`${P} ended it.`}[d.endReason];
    const cancelled = d.endReason==='PERSON_ENDED' && a.waiting ? `<div class="small" style="margin-top:6px">${esc(a.waiting)}: <span class="pill">cancelled · DELEGATION_ENDED</span> stays visible in the audit. ${tag('AG-11-112(f)')}</div>` : '';
    note = `<div class="notice info"><span class="ic">i</span><div class="small">${reasonText} The record is final; a new offer is a new record needing a new acceptance. ${tag('AW-1-11(b)(c)')}${cancelled}</div></div>`;
    actions = d.viewAs==='owner' ? `<button class="btn primary" data-act="d-restart">Set up a new offer</button>` : '';
  }
  return `<div class="card">
    <div class="card-head"><h2>${esc(a.name)} for ${esc(p.label)}</h2>${stateMap[d.state]}</div>
    ${summary}
    <div class="section stack">${note}<div class="row">${actions}</div></div>
  </div>`;
}

function validateFirm(){
  const errs = {};
  FIRMVALS.forEach(f=>{
    if(!f.dir) return;
    const raw = S.st.firm[f.k]; if(raw==='' || raw==null) return;
    const v = parseFloat(raw);
    if(!isFinite(v) || v<0){ errs[f.k]='Enter a number.'; return; }
    if((f.k==='conf'||f.k==='hidden'||f.k==='alarm') && v>100){ errs[f.k]='Enter 100 or less.'; return; }
    const p = PLAT[f.k];
    if(f.dir==='higher' && v<p) errs[f.k]=`Refused: looser than Expat Ready's ${p}${f.unit}. You may only make it stricter (higher).`;
    if(f.dir==='lower' && v>p) errs[f.k]=`Refused: looser than Expat Ready's ${p}${f.unit}. You may only make it stricter (lower).`;
  });
  return errs;
}

  ['case','Case assistant','Assistant to the case officer'],
  ['intake','Intake assistant','Assistant to the intake role'],
  ['billing','Billing assistant','Assistant to Billing / Finance'],
  ['firm','Firm assistant','Assistant to the Owner and the Case Manager'],
  ['expert','Practice expert · summary line only','The AI summary line on practice answers; the answers themselves have no switch']
];
function screenSet(){
  const st = S.st;
  const recPill = st.record==='none' ? '<span class="pill">Not published</span>' : st.record==='published' ? '<span class="pill ok">Published</span>' : '<span class="pill danger">Withdrawn</span>';
  let aiBox;
  if(st.record==='none'){
    aiBox = `<div class="locked-box"><div class="lock-ic">🔒</div><div class="stack" style="gap:6px">
      <div class="row" style="gap:8px"><b>AI is locked</b><span class="pill">Locked</span>${tag('AG-16-35')}</div>
      <p class="small">Locked because there is <b>no published AI provider record (Canada region, no training, no retention, a passed test call)</b>. ${tag('AW-1-52')}${tag('SA-8-49')}</p>
      <p class="xs faint">While locked, no AI step runs. Practice answers and the deadline watch still work. Nothing here names a provider; the provider is replaceable. ${tag('AW1-D21')}${tag('AW-2-26')}</p>
    </div><button class="switch" role="switch" aria-checked="false" disabled aria-label="AI switch (locked)" style="margin-left:auto"></button></div>`;
  } else if(st.record==='withdrawn'){
    aiBox = `<div class="notice paused"><span class="ic">ǁ</span><div class="small"><b>AI paused: Expat Ready withdrew the published provider record.</b> Reason code <code>PROVIDER_RECORD_WITHDRAWN</code>. Assistants and their waiting items are paused, not ended; on release, waiting items need a fresh approval. ${tag('AG-16-55')}${tag('SA-8-50')}${tag('AW-1-11(a)')}</div></div>`;
  } else {
    const on = st.ai==='on';
    aiBox = `<div class="stack">
      <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;gap:14px">
        <div class="stack" style="gap:4px"><div class="row" style="gap:8px"><b>AI for Firm F</b><span class="pill ${on?'ok':''}">${on?'On':'Off · record published, not yet switched on'}</span>${tag('AG-16-35')}</div>
        <p class="small muted">${on?'Switched on by the Owner with an audited acknowledgement. One switch for all four AI Doers.':'The record is published. The Owner switches AI on once, with an audited acknowledgement.'}</p></div>
        <button class="switch" role="switch" aria-checked="${on}" data-act="s-ai" ${(!on && !st.ack)?'disabled':''} aria-label="AI switch"></button>
      </div>
      ${on?'':`<label class="check" style="cursor:pointer"><input type="checkbox" data-act="s-ack" ${st.ack?'checked':''} style="margin-top:3px"> <span class="small">I acknowledge that firm data is processed by the published AI provider in Canada, under no-training and no-retention terms. ${ill('(wording illustrative)')}</span></label>`}
    </div>`;
  }
  const aiOn = st.record==='published' && st.ai==='on';
  const swRows = ASSTS.map(a=>`<div class="setrow"><div><div class="t">${esc(a[1])}</div><div class="d">${esc(a[2])} · off by default ${tag(a[0]==='expert'?'AG-16-57 expertSummaryLine':'AG-16-57')}</div>
      ${st.sw[a[0]] && !aiOn ? '<div class="xs" style="color:var(--warn);margin-top:3px">On, but no effect while AI is off or locked.</div>' : ''}</div>
      <button class="switch" role="switch" aria-checked="${st.sw[a[0]]}" data-act="s-sw" data-v="${a[0]}" aria-label="${esc(a[1])}"></button></div>`).join('');
  const valRow = f => {
    const p = PLAT[f.k];
    const editable = !!f.dir;
    const err = st.errors[f.k];
    return `<tr><td class="small" style="min-width:200px">${esc(f.label)} ${tag(f.tagid)}</td>
      <td class="small"><b>${p}${f.unit}</b> <div class="illus">illustrative</div></td>
      <td>${editable ? `<input type="number" step="any" data-firm="${f.k}" value="${esc(st.firm[f.k])}" placeholder="none set" aria-label="Firm value for ${esc(f.label)}">${err?`<div class="err">${esc(err)}</div>`:''}` : '<span class="small muted">No firm value: which direction is stricter is not settled.</span>'}</td>
      <td class="small muted">${f.dir==='higher'?'Higher':f.dir==='lower'?'Lower':'—'}</td></tr>`;
  };
  return `
  <div class="page-head">
    <div class="eyebrow">Screen 6 of 6</div>
    <h1>Firm settings · AI</h1>
    <p class="lead">AI stays locked for every firm until Expat Ready publishes a provider record that processes in Canada, with no training, no retention and a passed test call. Each assistant then has its own switch, off by default. ${tag('AW-1-52')}${tag('AW-1-125')}</p>
  </div>
  <div class="scenario"><span>◇</span><div><b>Scenario.</b> Signed in as <b>the Owner of Firm F</b>, before Expat Ready has published its AI provider record. Use the demo control to publish it. Values are illustrative: the real values are set by the team before launch. Fictional.</div></div>
  <div class="demo">
    <div class="lbl" style="font-size:12px;font-weight:700;margin-bottom:8px">DEMO CONTROL · Expat Ready side · AI provider record ${recPill} ${tag('SA-8-49')}${tag('SA-8-50')}</div>
    <div class="row" style="justify-content:space-between">
      <div class="seg" role="group" aria-label="Provider record state">
        <button data-act="s-rec" data-v="none" aria-pressed="${st.record==='none'}">Not published</button>
        <button data-act="s-rec" data-v="published" aria-pressed="${st.record==='published'}">Published</button>
        <button data-act="s-rec" data-v="withdrawn" aria-pressed="${st.record==='withdrawn'}">Withdrawn</button>
      </div>
      ${st.record==='published'?'<span class="small muted">Region: Canada · no training · no retention · test call passed from that region · provider: [name on the record] '+ill('(placeholder)')+'</span>':''}
    </div>
  </div>
  <div class="card"><div class="card-head"><h2>AI</h2>${tag('AG-16-35')}</div><div class="card-pad">${aiBox}</div></div>
  <div class="card">
    <div class="card-head"><h2>Advanced · AI assistants</h2><span class="small muted">The Owner sets these; every change is audited ${tag('AG-16-29')}</span></div>
    ${swRows}
    <div class="setrow"><div class="d">Switching an assistant off pauses its work (<code>ASSISTANT_SWITCH_OFF</code>); it never ends anyone's delegation. No switch turns an AI Doer on or off. Assistants are firm settings inside the one AI extra, not plan features. ${tag('AW-1-11')}${tag('AW-1-57')}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Safeguards and spend caps</h2><span class="small muted">Editable by the Owner and the Admin · audited ${tag('agent/settings:edit')}</span></div>
    <div class="section">
      <div class="notice info"><span class="ic">i</span><div class="small"><b>Founder safeguards · approve-all part: On.</b> Expat Ready's values are read-only here. Your firm may set stricter values, never looser. Only Expat Ready's Platform Owner can switch this part off, recording the founder's decision. ${tag('SA-12-33(a)')}${tag('AW1-D25')}</div></div>
    </div>
    <div class="section">
      <h4>Approve-all safeguards ${tag('AW-1-33')}</h4>
      <div class="tw"><table class="vals"><thead><tr><th>Setting</th><th>Expat Ready</th><th>Your firm (stricter only)</th><th>Stricter is</th></tr></thead>
      <tbody>${FIRMVALS.filter(f=>f.group==='safe').map(valRow).join('')}</tbody></table></div>
    </div>
    <div class="section">
      <h4>Spend caps · a cost control, not a founder safeguard ${tag('AW-1-54')}</h4>
      <div class="tw"><table class="vals"><thead><tr><th>Cap</th><th>Expat Ready</th><th>Your firm (lower only)</th><th>Stricter is</th></tr></thead>
      <tbody>${FIRMVALS.filter(f=>f.group==='cap').map(valRow).join('')}</tbody></table></div>
      <p class="xs faint" style="margin-top:8px">Reaching a cap stops new model calls only; items already waiting stay approvable. Assistants use the stricter of the two values. ${tag('AW-1-20(c)')}</p>
    </div>
    <div class="section row" style="justify-content:space-between">
      <span class="small ${st.saved==='ok'?'':'muted'}" style="${st.saved==='ok'?'color:var(--ok)':st.saved==='err'?'color:var(--danger)':''}">${st.saved==='ok'?'Saved and audited.':st.saved==='err'?'Not saved: fix the refused values.':'Changes are checked on save.'}</span>
      <button class="btn primary" data-act="s-save">Save firm values</button>
    </div>
  </div>
  ${foot('AW-1-11, AW-1-20(c), AW-1-33, AW-1-52, AW-1-53, AW-1-54, AW-1-57, AW-1-125; AW1-D21, AW1-D25, AW1-D34, AW1-D37; AG-16-35 (CN-AG-16 change 1: locked until a published record); AG-16-55 (CN-AG-16 change 2); AG-16-57 (CN-AG-16 change 4: per-assistant switches off by default, platform values read-only, firm\'s stricter values); SA-8-49, SA-8-50 (CN-SA-08 change 2); SA-12-33 (CN-SA-12 change 3); AW-2-25, AW-2-26; US-38, US-40, US-106, US-111.', 'Every number on this screen is illustrative: SA-12-33 leaves the values to the team before the first deployment, and AW-01 restates none.')}`;
}

/* ======================================================================
   ABOUT
   ====================================================================== */
function screenAbout(){
  return `
  <div class="page-head">
    <div class="eyebrow">About</div>
    <h1>About this prototype</h1>
  </div>
  <div class="card card-pad about">
    <p><b>What it is.</b> A clickable walk-through of six moments in Expat Ready's firm AI assistants, for the founder and the product team. Each screen shows one rule working: a person approves, an assistant works for a named person, and every step is recorded.</p>
    <p><b>What it is not.</b> Illustrative only. It is <b>not</b> the product's design system, not a screen specification, and not a promise of layout or wording. Where the requirements leave a detail open, the screen keeps it generic or marks it <span class="illus">illustrative</span>. All names, dates, amounts and values are fictional. No provider is named.</p>
    <p><b>Built from.</b> AW-01 Firm AI assistants v0.5 and AW-02 Platform AI assistants v0.6 (both passed), with the change notes they cite and the worked examples in the behaviour documents, on <b>11 October 2026</b>.</p>
    <p><b>How to read it.</b></p>
    <ul>
      <li>Each screen ends with a muted <b>Traces to</b> line listing the requirements it shows.</li>
      <li>Small grey tags beside elements give the exact requirement. Turn them off with <b>Requirement tags</b> in the menu.</li>
      <li>Dashed purple boxes are <b>demo controls</b>: they play a part the real product leaves to someone else (for example, Expat Ready releasing a stop).</li>
      <li>Internal names (Case assistant, Practice expert) appear only in this prototype's menu and captions. Inside the product screens, assistants are called “AI assistance” or “assistant to the <i>role</i>” (AW-1-65).</li>
      <li>Screens share one story: what you decide on screen 1 appears on screen 3.</li>
    </ul>
    <p class="small muted" style="margin-top:14px">Every requirement here is still a Proposal until the founder places the modules on Drive. The safety rules are provisional until counsel reads them (AIW-D55 to D58, D64).</p>
  </div>
  ${foot('AW-01 v0.5 (AW-1-1 to AW-1-126); AW-02 v0.6; 00-step3-plan.md item E; README rule 7 (prototype in prototype/, every screen traced), rule 9 (one word per thing), rule 10 (no personal names).')}`;
}

/* =============================== events =============================== */
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){ S.screen = go.dataset.go; render(); $('#main').focus({preventScroll:true}); window.scrollTo(0,0); return; }
  const th = e.target.closest('[data-theme-set]');
  if(th){ S.theme = th.dataset.themeSet; if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); try{localStorage.setItem('aiw-theme', S.theme);}catch(_){} renderNav(); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if(el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='checkbox' && el.type!=='radio')) return;
  const n = S.needs, d = S.dl, b = S.bi, st = S.st;
  switch(act){
    case 'tags': S.tags = !S.tags; renderNav(); return;
    /* needs */
    case 'n-view': n.viewAs = v; break;
    case 'n-alarm': n.alarmSeen = true; break;
    case 'n-toggle': n.open[el.dataset.k] = !n.open[el.dataset.k]; break;
    case 'n-open': n.opened[v] = true; n.srcOpen = v; break;
    case 'n-src': n.srcOpen = n.srcOpen===v ? null : v; break;
    case 'n-holdout': {
      const inp = $('#holdout-in'); const val = (inp?inp.value:n.holdout).trim();
      if(!val){ inp && inp.focus(); return; }
      n.holdout = val; n.holdoutResult = (val === VALUES.find(x=>x.holdout).val) ? 'match' : 'nomatch'; break; }
    case 'n-approve': if(!needsGate().ready) return; n.report='approved'; n.reportAt = nowStamp(); break;
    case 'n-some': n.someNote = !n.someNote; break;
    case 'n-reject': n.rejecting = true; break;
    case 'n-reject-cancel': n.rejecting = false; break;
    case 'n-reject-confirm': { const t=$('#rej'); n.rejectReason = t?t.value.trim():''; if(!n.rejectReason){ t&&t.focus(); return; } n.rejecting=false; n.report='rejected'; break; }
    case 'n-reset': Object.assign(n, {opened:{}, srcOpen:null, holdout:'', holdoutResult:null, report:'pending', reportAt:null, rejecting:false, rejectReason:'', someNote:false}); break;
    case 'p-release': n.paused='stale'; break;
    case 'p-review': n.paused='reviewed'; break;
    case 'p-approve': n.paused='approved'; break;
    case 'p-reject': n.pausedRejecting = true; break;
    case 'p-reject-cancel': n.pausedRejecting = false; break;
    case 'p-reject-confirm': n.pausedRejecting=false; n.paused='rejected'; break;
    case 'p-reset': n.paused='paused'; break;
    /* delegation */
    case 'd-view': d.viewAs = v; d.confirmEnd=false; break;
    case 'd-key': d.keys[v] = el.checked; render(); return;
    case 'd-offer': {
      const p = dlPerson();
      if(d.assistant!=='expert' && !Object.values(d.keys).some(Boolean)){ alert('Tick at least one permission.'); return; }
      d.state='pending'; d.endReason=null; d.waiting='pending'; d.switchOn=true;
      dlLog(`The Owner set up ${A[d.assistant].name.toLowerCase()} for ${p.label} · mode PERSON · ${p.label} notified`); break; }
    case 'd-withdraw': d.state='ended'; d.endReason='WITHDRAWN'; dlLog('The Owner withdrew the pending offer · endReason WITHDRAWN · nothing ran under it'); break;
    case 'd-accept': {
      const p = dlPerson();
      if(d.switchOn){ d.state='active'; dlLog(`${p.label[0].toUpperCase()+p.label.slice(1)} accepted · ACTIVE · acceptedAt recorded`); }
      else { d.state='paused'; dlLog(`${p.label[0].toUpperCase()+p.label.slice(1)} accepted · PAUSED (ASSISTANT_SWITCH_OFF)`); }
      break; }
    case 'd-decline': { const p=dlPerson(); d.state='ended'; d.endReason='DECLINED'; dlLog(`${p.label[0].toUpperCase()+p.label.slice(1)} declined · endReason DECLINED`); break; }
    case 'd-switch': {
      d.switchOn = !d.switchOn;
      if(!d.switchOn){ d.state='paused'; if(d.waiting==='pending'||d.waiting==='stale') d.waiting='paused'; dlLog(`The Owner switched ${A[d.assistant].name.toLowerCase()} off · delegation PAUSED (ASSISTANT_SWITCH_OFF) · waiting items PAUSED`); }
      else { d.state='active'; if(d.waiting==='paused') d.waiting='stale'; dlLog(`The Owner switched ${A[d.assistant].name.toLowerCase()} on · delegation ACTIVE, no new acceptance · waiting items re-rendered stale`); }
      break; }
    case 'd-end': d.confirmEnd = true; break;
    case 'd-end-cancel': d.confirmEnd = false; break;
    case 'd-end-confirm': { const p=dlPerson(); d.confirmEnd=false; d.state='ended'; d.endReason='PERSON_ENDED'; d.waiting='cancelled';
      dlLog(`${p.label[0].toUpperCase()+p.label.slice(1)} ended the delegation · endReason PERSON_ENDED${A[d.assistant].waiting?' · waiting item cancelled (DELEGATION_ENDED)':''}`); break; }
    case 'd-restart': d.state='setup'; d.endReason=null; d.waiting='pending'; d.switchOn=true; dlInitKeys(); break;
    /* provenance */
    case 'pv-filter': S.pv.filter = v; S.pv.open=null; break;
    case 'pv-open': S.pv.open = S.pv.open===v ? null : v; break;
    /* expert */
    case 'ex-q': S.ex.q = +v; break;
    case 'ex-ai': S.ex.aiOff = !S.ex.aiOff; break;
    case 'ex-untested': S.ex.untested = !S.ex.untested; break;
    /* billing */
    case 'b-pick': if(parseAmt(b.amount)===null) return; b.picked = v; b.modal = true; b.closedUnsaved=false; break;
    case 'rp-cancel': b.modal=false; b.closedUnsaved=true; break;
    case 'rp-save': {
      const dt=$('#rp-d'), rf=$('#rp-r'); b.date = dt?dt.value:''; b.ref = rf?rf.value:'';
      if(!b.method || !b.designation) return; b.modal=false; b.saved=true; b.item='approved'; break; }
    case 'b-reset': Object.assign(b,{amount:'', currency:'CAD', picked:null, modal:false, saved:false, item:'pending', method:'', designation:'', date:'', ref:'', closedUnsaved:false}); break;
    /* settings */
    case 's-rec': st.record = v; if(v!=='published'){ st.ai = v==='none'?'locked':st.ai; } if(v==='published' && st.ai==='locked') st.ai='off'; if(v==='none'){ st.ai='locked'; st.ack=false; } break;
    case 's-ack': st.ack = el.checked; render(); return;
    case 's-ai': st.ai = st.ai==='on' ? 'off' : 'on'; break;
    case 's-sw': st.sw[v] = !st.sw[v]; break;
    case 's-save': { document.querySelectorAll('[data-firm]').forEach(i=>st.firm[i.dataset.firm]=i.value); st.errors = validateFirm(); st.saved = Object.keys(st.errors).length ? 'err' : 'ok'; break; }
    default: return;
  }
  render();
});

document.addEventListener('change', e=>{
  const el = e.target, act = el.dataset && el.dataset.act;
  if(!act) return;
  const d = S.dl, b = S.bi;
  switch(act){
    case 'd-asst': d.assistant = el.value; d.person = Object.keys(A[d.assistant].persons)[0]; dlInitKeys(); break;
    case 'd-person': d.person = el.value; dlInitKeys(); break;
    case 'ex-scope': S.ex.scope = el.value; break;
    case 'ex-file': S.ex.file = el.value; break;
    case 'ex-item': S.ex.item = el.value; break;
    case 'b-cur': b.currency = el.value; { const c=$('#cands'); if(c) c.innerHTML = candHtml(); } return;
    case 'rp-m': b.method = el.value; break;
    case 'rp-des': b.designation = el.value; break;
    default: return;
  }
  if(act==='rp-m' || act==='rp-des'){ const dt=$('#rp-d'), rf=$('#rp-r'); if(dt) b.date=dt.value; if(rf) b.ref=rf.value; }
  render();
});

document.addEventListener('input', e=>{
  const el = e.target;
  if(el.id==='b-amt'){ S.bi.amount = el.value; const c=$('#cands'); if(c) c.innerHTML = candHtml(); return; }
  if(el.id==='holdout-in'){ S.needs.holdout = el.value; return; }
  if(el.dataset && el.dataset.firm){
    S.st.firm[el.dataset.firm] = el.value;
    const errs = validateFirm(); const cell = el.parentElement;
    let m = cell.querySelector('.err'); if(m) m.remove();
    if(errs[el.dataset.firm]){ m = document.createElement('div'); m.className='err'; m.textContent = errs[el.dataset.firm]; cell.appendChild(m); }
    S.st.saved = null;
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='holdout-in'){ e.preventDefault(); const btn=document.querySelector('[data-act="n-holdout"]'); btn && btn.click(); }
  if((e.key==='Enter' || e.key===' ') && e.target.classList && e.target.classList.contains('prov-row')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Escape' && S.bi.modal){ S.bi.modal=false; S.bi.closedUnsaved=true; render(); }
});

/* =============================== init =============================== */
try{ const t = localStorage.getItem('aiw-theme'); if(t==='light'||t==='dark'){ S.theme=t; document.documentElement.setAttribute('data-theme', t); } }catch(_){}
render();
})();
</script>
</body>
</html>
