<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Team Prototype</title>
<meta name="description" content="Prototype: simulated data, not the product. A clickable simulation of Expat Ready's AI team as agreed in the founder's decisions of 12 Oct 2026. Made-up data; no tests run.">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e8ebf0;
  --text:#141821; --muted:#555f6e; --faint:#828b99; --border:#e2e5ea; --border-strong:#cfd4dc;
  --accent:#2c56c9; --accent-ink:#ffffff; --accent-soft:#e9effc;
  --ok:#17744a; --ok-soft:#e2f3e9; --warn:#9a5600; --warn-soft:#fcf0dc;
  --danger:#b3261e; --danger-soft:#fce7e5; --ai:#6440b8; --ai-soft:#eee8fa;
  --paused:#8a5a00; --paused-soft:#fbefd6;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:12px; --radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161a22; --surface-2:#1b2029; --surface-3:#232934;
    --text:#e6e9ef; --muted:#a2abb9; --faint:#79828f; --border:#2a303b; --border-strong:#39404d;
    --accent:#7fa3ff; --accent-ink:#0e1117; --accent-soft:#1c2843;
    --ok:#5cc690; --ok-soft:#13301f; --warn:#f0b55e; --warn-soft:#382912;
    --danger:#ff8c82; --danger-soft:#3b1a18; --ai:#b9a0ff; --ai-soft:#271f3f;
    --paused:#f0b55e; --paused-soft:#352712;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface-2:#1b2029; --surface-3:#232934;
  --text:#e6e9ef; --muted:#a2abb9; --faint:#79828f; --border:#2a303b; --border-strong:#39404d;
  --accent:#7fa3ff; --accent-ink:#0e1117; --accent-soft:#1c2843;
  --ok:#5cc690; --ok-soft:#13301f; --warn:#f0b55e; --warn-soft:#382912;
  --danger:#ff8c82; --danger-soft:#3b1a18; --ai:#b9a0ff; --ai-soft:#271f3f;
  --paused:#f0b55e; --paused-soft:#352712;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
code,.code{font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand-name{font-weight:650;font-size:14px}
.brand-sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:8px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .num{width:20px;height:20px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;color:var(--muted)}
.nav button[aria-current="page"] .num{background:var(--accent);color:var(--accent-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.mini-toggle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.main{min-width:0;padding:28px clamp(16px,4vw,44px) 60px}
.topbar{display:none}

/* ---------- common ---------- */
.screen{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.page-head{display:flex;flex-direction:column;gap:8px}
.page-head h1{font-size:26px;font-weight:700}
.lead{color:var(--muted);max-width:760px}
.scenario{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--muted)}
.scenario b{color:var(--text);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card-head h2{font-size:17px;font-weight:650}
.card-head h3{font-size:15px;font-weight:650}
.section{padding:16px 20px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:0}
.section h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:10px;font-weight:650}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2.split-l{grid-template-columns:minmax(0,310px) minmax(0,1fr)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.xs{font-size:12px}
.sep{height:1px;background:var(--border);margin:6px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.paused{background:var(--paused-soft);color:var(--paused)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.outline{background:transparent;border:1px solid var(--border-strong)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--text);min-height:38px}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 8px;min-height:auto}
.btn.sm{padding:5px 10px;font-size:13px;min-height:30px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,.seg button:focus-visible,.switch:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.switch{position:relative;width:40px;height:23px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(17px)}
.switch:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.notice{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.notice.info{background:var(--accent-soft);color:var(--text)}
.notice.ok{background:var(--ok-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.paused{background:var(--paused-soft)}
.notice.danger{background:var(--danger-soft)}
.notice .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.notice.info .ic{background:var(--accent);color:var(--accent-ink)}
.notice.ok .ic{background:var(--ok);color:var(--surface)}
.notice.warn .ic,.notice.paused .ic{background:var(--warn);color:var(--surface)}
.notice.danger .ic{background:var(--danger);color:var(--surface)}
.tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.low td{background:color-mix(in srgb,var(--warn-soft) 70%,transparent)}
tr.low.opened td{background:transparent}
.conf{font-family:var(--mono);font-size:12.5px}
.conf.lowc{color:var(--warn);font-weight:700}
.src-box{margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.src-img{height:54px;border-radius:6px;margin-top:6px;background:repeating-linear-gradient(135deg,var(--surface-3) 0 8px,var(--surface) 8px 16px);display:grid;place-items:center;font-size:11.5px;color:var(--faint);border:1px solid var(--border)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.check.done .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check.done .t{color:var(--muted)}
.ai-block{border-left:3px solid var(--ai);background:var(--ai-soft);border-radius:0 8px 8px 0;padding:10px 12px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--faint);padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.step .n{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:11px}
.step.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--accent-soft)}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.past{color:var(--ok)}
.step.past .n{background:var(--ok);color:var(--surface)}
.keylist{display:flex;flex-direction:column;gap:2px}
.keyrow{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:7px}
.keyrow:hover{background:var(--surface-2)}
.keyrow input{margin-top:3px;flex:none}
.keyrow.never{opacity:.62}
.keyrow.never .lock{flex:none;width:16px;text-align:center;margin-top:1px;color:var(--faint)}
.keyrow .k{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.keyrow .why{font-size:12.5px;color:var(--muted)}
.audit{display:flex;flex-direction:column;gap:0;font-size:13px}
.audit div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.audit div:last-child{border-bottom:0}
.audit time{color:var(--faint);font-family:var(--mono);font-size:12px}
.item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.item-top{padding:14px 18px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.item-top:hover{background:var(--surface-2)}
.item-title{font-weight:650;font-size:15.5px}
.item-meta{font-size:13px;color:var(--muted);margin-top:3px}
.chev{flex:none;color:var(--faint);transition:transform .15s;margin-top:4px}
.item[data-open="true"] .chev{transform:rotate(90deg)}
.foot{margin-top:6px;border-top:1px solid var(--border);padding-top:12px;font-size:12px;color:var(--faint);line-height:1.6}
.foot b{font-weight:600;color:var(--muted)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap;font-weight:400;letter-spacing:0;text-transform:none}
body.hide-tags .tag{display:none}
.illus{font-size:11px;font-style:italic;color:var(--faint)}
.answer-line{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.answer-line:last-child{border-bottom:0}
.menu-q{display:flex;flex-direction:column;gap:6px}
.menu-q button{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.menu-q button:hover{border-color:var(--border-strong)}
.menu-q button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.menu-q .qn{width:22px;height:22px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted)}
.cand{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.cand.exact{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.cand .amt{font-family:var(--mono);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--border)}
.setrow{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:0}
.setrow .t{font-weight:600}
.setrow .d{font-size:13px;color:var(--muted);margin-top:2px}
.vals td input{width:110px}
.err{color:var(--danger);font-size:12.5px;margin-top:4px}
.okmsg{color:var(--ok);font-size:12.5px;margin-top:4px}
.locked-box{display:flex;gap:14px;align-items:flex-start}
.lock-ic{width:38px;height:38px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;flex:none;font-size:17px}
.demo{border:1px dashed var(--ai);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--ai-soft) 55%,transparent)}
.demo .lbl{color:var(--ai)}
.about p+p{margin-top:10px}
.about ul{margin:6px 0 0 18px;padding:0}
.about li{margin:4px 0}
.prov-row{cursor:pointer}
.prov-row:hover td{background:var(--surface-2)}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ba > div{border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;background:var(--surface-2)}
.ba .lbl{display:block;margin-bottom:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* ---------- phone ---------- */
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px 10px}
  .topbar .brand{padding:0}
  .topnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .topnav::-webkit-scrollbar{display:none}
  .topnav button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .topnav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .main{padding:18px 16px 48px}
  .page-head h1{font-size:22px}
  .grid2,.grid2.split-l,.ba{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .audit div{grid-template-columns:minmax(0,1fr);gap:2px}
  .card-pad,.section,.card-head,.setrow{padding-left:14px;padding-right:14px}
  .item-top{padding:12px 14px}
  .setrow{flex-direction:column}
}

.topbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* ---------- 12 Oct additions ---------- */
.simbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;text-align:center}
.simbar span{font-weight:400;color:var(--muted)}
.cl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.cl::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.cl-r{background:var(--surface-3);color:var(--muted);border-color:var(--border-strong)}
.cl-p{background:var(--ai-soft);color:var(--ai)}
.cl-d{background:var(--warn-soft);color:var(--warn)}
.cl-a{background:var(--ok-soft);color:var(--ok)}
.labels{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hero{padding:30px 28px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(26px,4vw,36px);font-weight:750;letter-spacing:-.02em}
.hero .sup{font-size:17px;color:var(--muted);max-width:720px}
.hero .msg{font-size:15px;font-weight:650;color:var(--accent)}
.jgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.jcard{text-align:left;cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.jcard:hover{border-color:var(--border-strong)}
.jcard b{font-size:15px}
.jcard span{font-size:13px;color:var(--muted)}
.tm{display:flex;flex-direction:column;gap:10px}
.tm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.skill{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--border)}
.skill:last-child{border-bottom:0}
.light{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.light::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border-strong)}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.counts b{font-size:18px;display:block;font-weight:700}
.jsteps{display:flex;flex-direction:column}
.jstep{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--border);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.jstep:hover{background:var(--surface-2)}
.jstep:last-child{border-bottom:0}
.jstep .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--surface-3);color:var(--muted)}
.jstep.done .ic{background:var(--ok);color:var(--surface)}
.jstep.held .ic{background:var(--ai);color:var(--surface)}
.jstep.wait .ic{background:var(--warn);color:var(--surface)}
.jstep.run .ic{background:var(--accent);color:var(--accent-ink)}
.jstep.todo{opacity:.55}
.jstep .st{font-size:13.5px;font-weight:600}
.jstep .sd{font-size:12.5px;color:var(--muted);margin-top:2px}
.vrow{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:12px;align-items:start;background:var(--surface)}
.vrow.okd{background:color-mix(in srgb,var(--ok-soft) 60%,var(--surface))}
.vrow .vf{font-size:12.5px;color:var(--muted);font-weight:600}
.vrow .vv{font-size:15px;font-weight:650;margin-top:2px;overflow-wrap:anywhere}
.passage{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:var(--text);overflow-wrap:anywhere}
.passage small{display:block;font-family:var(--font);color:var(--faint);font-size:11.5px;margin-bottom:3px}
.kindtag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kindtag.identity{color:var(--accent)}
.kindtag.conseq{color:var(--warn)}
.kindtag.conflict{color:var(--danger)}
.draft{border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.draft.stale{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.doc{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13.5px;line-height:1.6}
.hl{background:color-mix(in srgb,var(--accent-soft) 80%,transparent);border-radius:4px;padding:0 3px;font-weight:600}
.grid-t td,.grid-t th{padding:6px 8px;font-size:12.5px}
.grid-t select{min-height:30px;padding:3px 6px;font-size:12.5px}
.grid-t .lockcell{color:var(--faint);font-size:12px;white-space:nowrap}
.preset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.preset button{text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.preset button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.preset b{font-size:15px}
.preset span{font-size:13px;color:var(--muted)}
.exlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.exbox{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface)}
.exbox h4{font-size:13px;margin-bottom:6px}
.exbox ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.exbox li{margin:3px 0}
.chatwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.chat{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;min-height:440px}
.chat-head{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:650;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.chat-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:520px}
.bub{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.bub.firm{background:var(--surface-2);border:1px solid var(--border);align-self:flex-start}
.bub.lead{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.bub .meta{font-size:11px;color:var(--faint)}
.chat-foot{border-top:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chips button:hover{background:var(--accent-soft)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:-10px 0 40px rgba(0,0,0,.18);z-index:60;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width: 860px){
  .jgrid,.tm-grid,.preset,.exlist,.chatwrap{grid-template-columns:minmax(0,1fr)}
  .vrow{grid-template-columns:minmax(0,1fr)}
  .hero{padding:22px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Prototype navigation">
    <div class="brand"><div class="brand-mark">ER</div><div><div class="brand-name">Your AI team</div><div class="brand-sub">Firm F · simulated prototype</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="mini-toggle"><span>Show decision IDs</span><button class="switch" role="switch" aria-checked="true" data-act="tags" aria-label="Show decision IDs on elements"></button></div>
      <div class="mini-toggle" style="flex-direction:column;align-items:flex-start"><span>Theme</span><div class="seg" id="theme-seg-side"></div></div>
    </div>
  </aside>
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><div class="brand-mark">ER</div><div><div class="brand-name">Your AI team</div><div class="brand-sub">Simulated prototype</div></div></div>
      <div class="row" style="gap:8px"><span class="xs muted">IDs</span><button class="switch" role="switch" aria-checked="true" data-act="tags" aria-label="Show decision IDs on elements"></button><div class="seg" id="theme-seg-top"></div></div>
    </div>
    <nav class="topnav" id="topnav" aria-label="Screens"></nav>
  </div>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";
/* Simulation only. Every value, step and result below is made up and played by this page's own script.
   Nothing is calculated by a real rules engine, no AI model is called, and no test has been executed. */

/* =============================== helpers =============================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag = t => `<span class="tag">${t}</span>`;
const nowStamp = () => new Date().toTimeString().slice(0,5);
const PACK = 3;
function foot(ids){ return `<div class="foot"><b>Decisions shown:</b> ${ids}</div>`; }
/* The four class labels (AIW-D92), worded as the Lead asked for the prototype */
function L(kind, who){
  if(kind==='rules') return `<span class="cl cl-r">Calculated by the rules, pack v${who||PACK}</span>`;
  if(kind==='prep')  return `<span class="cl cl-p">Prepared by ${esc(who)}</span>`;
  if(kind==='draft') return `<span class="cl cl-d">AI draft: check before use</span>`;
  if(kind==='appr')  return `<span class="cl cl-a">Approved by ${esc(who)}</span>`;
  return '';
}
const labels = (...xs) => `<div class="labels">${xs.join('')}</div>`;
function head(eyebrow, title, lead){
  return `<div class="page-head"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${lead?`<p class="lead">${lead}</p>`:''}</div>`;
}
const SIM = `<div class="simbar">Prototype: simulated data, not the product <span>· Made-up firm, people and files. No AI is called and no test has been run.</span></div>`;

/* =============================== state =============================== */
const S = {
  screen:'start', tags:true, theme:'auto', drawer:null,
  job:{ i:0, stopped:false, playing:false, ap:{reject:false, date:false} },
  rv:{ ok:{}, opened:{}, corr:{}, editing:null, spot:'', spotRes:null, rest:false, conflict:null,
       drafts:{form:'pending', letter:'pending', note:'pending'}, ver:{form:1, letter:1, note:1}, stale:{}, rejecting:null, reason:{} },
  as:{ ev:'ready', phase:'idle', pack:3, explained:false, reviewed:false, newer:false },
  bl:{ inv:'pending', ver:1, changed:false, invAt:null, trust:'none', trustAt:null, rejecting:null },
  set:{ preset:'each', open:false, over:{}, earned:false, chg:'pending', chgAt:null },
  inb:{ msgs:null, guided:0, draft:'none', q:'', edit:false, text:'' }
};

/* =============================== screens =============================== */
const SCREENS = [
  {id:'start', n:'★', label:'Start'},
  {id:'team',  n:'1', label:'AI team'},
  {id:'file',  n:'2', label:'File preparation'},
  {id:'assess',n:'3', label:'Assessment'},
  {id:'bill',  n:'4', label:'Billing'},
  {id:'set',   n:'5', label:'Settings'},
  {id:'intake',n:'6', label:'Intake chat'},
  {id:'about', n:'i', label:'About this prototype'}
];
function renderNav(){
  $('#nav').innerHTML = `<div class="nav-label">Screens</div>` + SCREENS.map(s =>
    `<button data-go="${s.id}" ${S.screen===s.id?'aria-current="page"':''}><span class="num">${s.n}</span>${s.label}</button>`).join('');
  $('#topnav').innerHTML = SCREENS.map(s =>
    `<button data-go="${s.id}" ${S.screen===s.id?'aria-current="page"':''}>${s.n==='i'?'About':s.label}</button>`).join('');
  const themeSeg = ['auto','light','dark'].map(t=>`<button data-theme-set="${t}" aria-pressed="${S.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
  $('#theme-seg-side').innerHTML = themeSeg; $('#theme-seg-top').innerHTML = themeSeg;
  document.querySelectorAll('[data-act="tags"]').forEach(b=>b.setAttribute('aria-checked', String(S.tags)));
  document.body.classList.toggle('hide-tags', !S.tags);
}
function render(){
  renderNav();
  const fn = {start:scStart, team:scTeam, file:scFile, assess:scAssess, bill:scBill, set:scSet, intake:scIntake, about:scAbout}[S.screen];
  $('#main').innerHTML = `<div class="screen">${SIM}${fn()}</div>`;
  $('#modal-root').innerHTML = S.drawer ? drawerHtml() : '';
}

/* ======================================================================
   START
   ====================================================================== */
function scStart(){
  return `
  <div class="card hero">
    <div class="eyebrow">Expat Ready · for licensed immigration practices</div>
    <h1>An AI team for your immigration practice.</h1>
    <p class="sup">Prepare files, organise documents and draft communications—with maintained rules underneath and your team in control.</p>
    <p class="msg">Rules you can defend. AI that does the legwork. ${tag('AIW-D99')}</p>
  </div>
  <div class="card card-pad stack">
    <h2 style="font-size:17px">Every output says what made it ${tag('AIW-D92')}</h2>
    <p class="small muted">Each thing you see carries one of four labels. Rule results are never called AI.</p>
    <div class="stack" style="gap:12px">
      <div class="stack" style="gap:4px"><span>${L('rules')}</span><span class="small">The product's fixed rules and the pack worked it out. No AI was used. Same input, same result.</span></div>
      <div class="stack" style="gap:4px"><span>${L('prep','Case Officer\'s AI')}</span><span class="small">An AI teammate prepared it for a named person, using rule results and the firm's records, with its sources.</span></div>
      <div class="stack" style="gap:4px"><span>${L('draft')}</span><span class="small">AI-written words or values read by AI. Nothing happens with it until a person checks and approves it.</span></div>
      <div class="stack" style="gap:4px"><span>${L('appr','the licensed consultant')}</span><span class="small">A named person decided. The record keeps who, when and exactly what they approved.</span></div>
    </div>
  </div>
  <h2 style="font-size:16px">See it work</h2>
  <div class="jgrid">
    <button class="jcard" data-go="team"><b>1 · Your AI team</b><span>Who each AI teammate works for, its skills, and a live view of the job running on a case.</span></button>
    <button class="jcard" data-go="file"><b>2 · Prepare a client file</b><span>Documents collected and checked, drafts prepared, then one review sitting at the end.</span></button>
    <button class="jcard" data-go="assess"><b>3 · Run an assessment</b><span>The AI starts it, the rules calculate it, and the AI stops when evidence is missing, stale or conflicting.</span></button>
    <button class="jcard" data-go="bill"><b>4 · Prepare billing</b><span>An invoice and a proposed trust entry, each approved against an exact preview.</span></button>
    <button class="jcard" data-go="set"><b>5 · Choose how much to review</b><span>Two presets, a grid under "Customise", and safety floors that never move.</span></button>
    <button class="jcard" data-go="intake"><b>6 · Intake chat at launch</b><span>Approved answers picked by a rule run on their own; AI-written replies wait for a person.</span></button>
  </div>
  <div class="card card-pad stack">
    <h2 style="font-size:16px">What a person always does</h2>
    <ul class="small" style="margin:0;padding-left:18px">
      <li>Approves every AI-written message before it reaches a client or lead ${tag('AIW-D102')}${tag('AIW-D105')}</li>
      <li>Checks values read from documents; a spot check never counts as checking every value ${tag('AIW-D100')}</li>
      <li>Approves each invoice, trust entry, export, deletion, settings change or signature workflow exactly as previewed; signs; moves money ${tag('AIW-D103')}</li>
      <li>Tells a lead or client their eligibility result ${tag('AIW-D96')}${tag('AIW-D41')}</li>
      <li>Submits to the government ${tag('FD-16')}</li>
    </ul>
  </div>
  ${foot('AIW-D99 (headline, supporting line, supporting message), AIW-D92 (four labels), AIW-D89 (AI teammate, skill, step).')}`;
}

/* ======================================================================
   JOB (shared by AI team and File preparation)
   ====================================================================== */
const JOB = [
  {t:'Job started on Case C-1 (Client A)', d:'The licensed consultant chose the pathway; the retainer is signed.', kind:'person', lab:()=>L('appr','the licensed consultant'),
   det:{read:'Case C-1 record; signed retainer', src:'Case C-1 · retainer v1', prop:'Nothing: this is a person\'s act', who:'The licensed consultant', fail:'—'}},
  {t:'Document checklist built from the pack', d:'7 documents needed for this pathway.', kind:'rules', lab:()=>L('rules'),
   det:{read:'Pathway on Case C-1', src:'Country pack v3 (fictional) · document list for the pathway', prop:'Checklist of 7 documents', who:'No approval needed: rules', fail:'—'}},
  {t:'Request for documents sent to Client A', d:'Published template "Documents we need" v2, chosen by a rule. Checks passed: recipient, consent, case status, no duplicate.', kind:'rules', lab:()=>L('appr','the Owner (published template v2)')+L('rules'),
   det:{read:'Checklist; Client A\'s verified email and consent', src:'Template "Documents we need" v2, published by the Owner', prop:'One email, merge fields from verified facts only', who:'The Owner, when the template was published (counts as approval for this send)', fail:'—'}},
  {t:'7 uploads read; 12 values proposed', d:'Values stay provisional and wait for the end-of-job review.', kind:'held', lab:()=>L('draft'),
   det:{read:'7 uploads from Client A', src:'Each value keeps its document, page and passage', prop:'12 provisional values', who:'Waiting for the end-of-job review', fail:'—'}},
  {t:'Passport check: expires before the planned submission date', d:'The client must re-send, so this is asked now, not held.', kind:'ask', ask:'reject', lab:()=>L('rules')+L('prep','Case Officer\'s AI'),
   det:{read:'Passport, version 1 · data page', src:'Pack v3 rule: passport valid on the planned submission date', prop:'Reject the upload; reason from Firm F template "Please re-send" v1', who:'Asked now', fail:'Upload does not meet the pack rule'}},
  {t:'Government letter: biometrics requested', d:'Due date read from the letter. Linked to a government deadline, so it is always asked now.', kind:'ask', ask:'date', lab:()=>L('draft'),
   det:{read:'Government letter (fictional), uploaded by the case officer', src:'Letter page 1: "within 30 days of the date of this letter"', prop:'Due date 2026-12-31 (fictional)', who:'Asked now (locked)', fail:'—'}},
  {t:'Task created by a rule: "Book biometrics appointment"', d:'Internal task for the licensed consultant, due 2 working days before the deadline.', kind:'rules', lab:()=>L('rules'),
   det:{read:'Approved due date', src:'Deadline watch', prop:'One task', who:'No approval needed: rules', fail:'—'}},
  {t:'Client A re-sent the passport; it passes the check', d:'Its values join the review.', kind:'rules', lab:()=>L('rules'),
   det:{read:'Passport, version 2', src:'Pack v3 passport rule', prop:'Pass', who:'No approval needed: rules', fail:'—'}},
  {t:'Form draft prepared: work history section', d:'Filled by the rules from the provisional values. Waits for the review.', kind:'held', lab:()=>L('rules')+L('prep','Case Officer\'s AI'),
   det:{read:'Provisional values: name, date of birth, employment start date, education', src:'Form mapping in pack v3', prop:'Form section draft, version 1', who:'Waiting for the end-of-job review', fail:'—'}},
  {t:'Letter of explanation drafted', d:'AI-written, with every fact used and its source. Waits for the review.', kind:'held', lab:()=>L('draft'),
   det:{read:'Provisional values: employment start date, language scores', src:'Reference letter p.1; language test result p.1', prop:'Letter draft, version 1', who:'Waiting for the end-of-job review', fail:'—'}},
  {t:'Internal note drafted', d:'File summary for the team. Never sent. Waits for the review.', kind:'held', lab:()=>L('draft'),
   det:{read:'Case C-1 activity', src:'Case C-1 timeline', prop:'Internal note', who:'Waiting for the end-of-job review', fail:'—'}},
  {t:'End-of-job review ready', d:'One sitting: values first, then the drafts.', kind:'end', lab:()=>L('prep','Case Officer\'s AI'),
   det:{read:'Everything held during the job', src:'This job', prop:'One review with 12 values and 3 drafts', who:'The licensed consultant', fail:'—'}}
];
function jobStatus(k){
  const j = S.job;
  if(k < j.i){
    const s = JOB[k];
    if(s.kind==='held') return 'held';
    return 'done';
  }
  if(k === j.i){
    const s = JOB[k];
    if(s.ask && !j.ap[s.ask]) return 'wait';
    if(j.stopped) return 'todo';
    return j.playing ? 'run' : 'todo';
  }
  return 'todo';
}
function jobDone(){ return S.job.i >= JOB.length; }
function heldCount(){ return JOB.filter((s,k)=>k<S.job.i && s.kind==='held').length; }
function waitingNow(){ const s = JOB[S.job.i]; return (s && s.ask && !S.job.ap[s.ask]) ? s : null; }
function stepJob(){
  const j = S.job; if(j.stopped || jobDone()) { j.playing=false; return false; }
  const s = JOB[j.i];
  if(s.ask && !j.ap[s.ask]){ j.playing=false; return false; }
  j.i++; return true;
}
let timer = null;
function play(){
  if(timer) return;
  S.job.playing = true; render();
  timer = setInterval(()=>{
    const moved = stepJob();
    if(!moved){ clearInterval(timer); timer=null; S.job.playing=false; }
    render();
  }, 650);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } S.job.playing=false; }

function jobPanel(compact){
  const j = S.job; const w = waitingNow();
  const preset = S.set.preset==='each' ? '"Review each step"' : '"Review at checkpoints"';
  let next = jobDone() ? (reviewComplete() ? 'Nothing: the review is complete' : 'The end-of-job review is waiting for you') :
             w ? `Waiting for you now: ${esc(w.t)}` : (j.stopped ? 'Stopped by you' : 'Next: '+esc(JOB[j.i].t));
  const rows = JOB.map((s,k)=>{
    const st = jobStatus(k);
    const ic = {done:'✓', held:'⏸', wait:'!', run:'…', todo:String(k+1)}[st];
    const badge = st==='held' ? '<span class="pill ai">Held for the review</span>' : st==='wait' ? '<span class="pill warn">Asks you now</span>' : st==='run' ? '<span class="pill accent">Running</span>' : '';
    return `<button class="jstep ${st}" data-act="drawer" data-v="${k}"><span class="ic">${ic}</span><span><div class="st">${esc(s.t)}</div>${compact?'':`<div class="sd">${esc(s.d)}</div>`}${st!=='todo'&&!compact?`<div style="margin-top:6px">${labels(s.lab())}</div>`:''}</span><span>${badge}</span></button>`;
  }).join('');
  return `<div class="card">
    <div class="card-head"><div><h3>AI on this case · Case C-1, Client A ${tag('AIW-D85')}</h3><div class="xs muted">Case Officer's AI, working for the licensed consultant · review setting ${preset}</div></div>
      <div class="row" style="gap:6px">
        ${jobDone()?'':(j.stopped?`<button class="btn sm" data-act="j-resume">Resume</button>`:`<button class="btn sm primary" data-act="j-play" ${w||j.playing?'disabled':''}>${j.i===0?'Start the job':'Run to the next stop'}</button><button class="btn sm danger" data-act="j-stop">Stop job</button>`)}
      </div></div>
    <div class="section"><div class="counts">
      <div><b>${JOB.filter((s,k)=>jobStatus(k)==='done').length}</b><span class="muted">steps done</span></div>
      <div><b>${heldCount()}</b><span class="muted">held for the review</span></div>
      <div><b>${w?1:0}</b><span class="muted">asking you now</span></div>
    </div><p class="small" style="margin-top:8px"><b>${next}</b></p>
    ${j.stopped?`<div class="notice paused" style="margin-top:8px"><span class="ic">■</span><div class="small">Stopped by you. It stops at the next safe point, never in the middle of a send. Nothing held is lost. ${tag('autonomy c.7')}</div></div>`:''}
    </div>
    <div class="section" style="padding-top:6px;padding-bottom:6px"><div class="jsteps">${rows}</div>
    <p class="xs faint" style="margin-top:6px">Click any step for the detail: what was read, the sources, what was proposed, who approved, what failed and why.</p></div>
  </div>`;
}
function drawerHtml(){
  const s = JOB[S.drawer]; if(!s) return '';
  const st = jobStatus(S.drawer);
  const stTxt = {done:'Done', held:'Held for the end-of-job review', wait:'Waiting for you now', run:'Running', todo:'Not started'}[st];
  return `<div class="overlay" data-act="drawer-close" style="place-items:stretch end;padding:0"></div>
  <aside class="drawer" role="dialog" aria-label="Step detail">
    <div class="row" style="justify-content:space-between"><div class="eyebrow">Step ${S.drawer+1} of ${JOB.length} · ${stTxt}</div><button class="btn sm" data-act="drawer-close">Close</button></div>
    <h2 style="font-size:18px">${esc(s.t)}</h2>
    ${labels(s.lab())}
    <dl class="kv">
      <dt>What was read</dt><dd>${esc(s.det.read)}</dd>
      <dt>Sources</dt><dd>${esc(s.det.src)}</dd>

}

  {n:13,a:'Export, deletion request or settings change', each:'Ask now', cp:'Ask now', opts:['Ask now','Off'], floor:'Never Auto; exact preview', roles:[1,1,0,0,0,0]},
  {n:14,a:'Signature workflow (the signer signs)', each:'Ask now', cp:'Ask now', opts:['Ask now','Off'], floor:'Never Auto; exact preview', roles:[1,0,1,1,0,0]}

function cellVal(r, ri){
  const key = r.n+'-'+ri;
  if(S.set.over[key]) return S.set.over[key];
  if(r.roles[ri]===0) return 'Off';
  let v = S.set.preset==='each' ? r.each : r.cp;
  if(r.earn && S.set.earned) v = 'Earned Auto';
  return v;
}
function chgCard(){
  const c = S.set.chg, to = S.set.chgTo || 14;

function scSet(){

      return `<tr><td>${esc(r.a)}${r.floor?`<div class="xs faint">🔒 ${esc(r.floor)}</div>`:''}</td>${ROLES.map((role,ri)=>{

    <div class="section stack">
      <p class="small muted">Draft internal notes, ordinary AI-proposed tasks and filing labels may run without a click once all three conditions are met. Never anything sent outside the firm, consequential, or changing a verified fact. ${tag('AIW-D104')}</p>
      <div class="check"><span class="box"></span><span class="t">The skill passed its test set <span class="faint">· not run: this is a prototype</span></span></div>
      <div class="check"><span class="box"></span><span class="t">Checked examples from real use support it (an unchanged-approval rate alone is not enough) <span class="faint">· none yet</span></span></div>
      <div class="check ${st.earned?'done':''}"><span class="box">${st.earned?'✓':''}</span><span class="t">The Owner approves, with the evidence recorded</span></div>
      <p class="small muted">Afterwards, sample checks continue at a rate set from the evidence. It returns to approval when quality falls, and is retested after any material change.</p>
      <div class="demo"><div class="lbl">Demo control</div><p class="small">In the product the Owner's button stays off until the first two conditions are met. Here you can pretend they are, to see the grid change.</p>
        <button class="btn sm" data-act="earn">${st.earned?'Withdraw earned Auto':'Pretend the conditions are met, and approve as the Owner'}</button></div>
    </div>
  </div>
  ${foot('AIW-D101 (two presets, "Review each step" default, grid under "Customise", floors locked, never grants access, approval before effect, examples), AIW-D104 (earned Auto for routine reversible internal work, its conditions, drop back and retest), AIW-D105 (template sends automatic), AIW-D102 (AI-written replies never automatic), AIW-D103 (rows 12–14 never Auto; the settings-change card: prepared by the AI, approved against the exact preview), AIW-D106 note (a) (row 4: the assessment starts automatically once the evidence check passes).')}`;
}

/* ======================================================================
   SCREEN 6 — INTAKE CHAT AT LAUNCH
   ====================================================================== */
const TPL = {
  welcome:{name:'Welcome', v:2, text:'Hello, and thank you for contacting Firm F. Choose a topic below, or ask us something.'},
  book:{name:'Book a consultation', v:3, text:'You can book a 30-minute consultation with a licensed consultant here: [booking link]. The first available times are shown when you open it.'},
  docs:{name:'Documents overview', v:1, text:'Most applications need identity, education, work and language documents. After you sign up, your file shows the exact list for your situation.'},
  fees:{name:'Fees', v:2, text:'Our consultation fee and service fees are listed here: [fees page]. We confirm fees in writing before any work starts.'},
  elig:{name:'Eligibility questions', v:1, text:'Only a licensed consultant can talk with you about eligibility, in a consultation. To prepare, we will ask you a few short questions.'},
  handoff:{name:'Hand-off to a person', v:1, text:'Thank you. A member of our team will reply to you here.'}
};
const GUIDED = [
  {q:'Which country do you live in now?', a:['Country X','Country Y','Other']},
  {q:'How many years of skilled work experience do you have?', a:['Less than 1','1 to 2','3 or more']},
  {q:'Have you taken a language test?', a:['Yes','Not yet']}
];
function inbInit(){ if(!S.inb.msgs) S.inb.msgs = [{from:'firm', tpl:'welcome'}]; }
function bubble(m){
  if(m.from==='lead') return `<div class="bub lead">${esc(m.text)}</div>`;
  if(m.tpl){ const t = TPL[m.tpl];
    return `<div class="bub firm"><div>${esc(t.text)}</div>${labels(L('appr',`the Owner (published template "${t.name}" v${t.v})`))}<div class="meta">Chosen by a rule: ${esc(m.rule||'start of chat')}</div></div>`; }
  if(m.guided!=null){ const g = GUIDED[m.guided];
    return `<div class="bub firm"><div>${esc(g.q)}</div>${labels(L('appr','the Owner (published guided intake v1)'))}<div class="meta">Guided intake question ${m.guided+1} of ${GUIDED.length} · chosen by a rule</div></div>`; }
  if(m.ai) return `<div class="bub firm"><div>${esc(m.text)}</div>${labels(L('prep','Intake AI'), L('appr','the licensed consultant'))}<div class="meta">AI-written, approved before sending</div></div>`;
  return '';
}
function scIntake(){
  inbInit();
  const n = S.inb;
  const last = n.msgs[n.msgs.length-1];
  let chips = '';
  if(last && last.guided!=null){
    chips = GUIDED[last.guided].a.map(a=>`<button data-act="in-g" data-v="${esc(a)}">${esc(a)}</button>`).join('');
  } else {
    chips = [['book','Book a consultation'],['docs','What documents will I need?'],['fees','Fees'],['elig','Am I eligible?']].map(c=>`<button data-act="in-menu" data-v="${c[0]}">${c[1]}</button>`).join('');
  }
  const staff = (()=>{
    let item = '';
    if(n.draft==='pending'){
      item = `<div class="card"><div class="card-head"><h3>Needs you · Reply to Lead L-2</h3><span class="pill warn">Ask now</span></div>
        <div class="section stack">
          <div class="passage"><small>Lead's question in the chat</small>${esc(n.q)}</div>
          ${labels(L('draft'), L('prep','Intake AI'))}
          ${n.edit?`<textarea id="in-edit">${esc(n.text)}</textarea>`:`<div class="ai-block small">${esc(n.text)}</div>`}
          <p class="xs muted">No published template fits this question, so a rule handed it to a person and Intake AI drafted a reply. It is not sent until a licensed person approves it. It contains no eligibility content.</p>
          <div class="row">${n.edit?`<button class="btn primary sm" data-act="in-edit-save">Save edit</button>`:`<button class="btn primary sm" data-act="in-ap">Approve and send as the licensed consultant</button><button class="btn sm" data-act="in-edit">Edit</button><button class="btn danger sm" data-act="in-rej">Reject</button>`}</div>
        </div></div>`;
    } else if(n.draft==='rejected'){
      item = `<div class="notice danger"><span class="ic">×</span><div class="small">Draft rejected. Nothing was sent. The hand-off task stays open for a person to reply.</div></div>`;
    }
    const done = n.msgs.filter(m=>m.tpl||m.guided!=null).length;
    return `<div class="stack">
      <div class="card card-pad stack"><h3 style="font-size:15px">Staff view · Intake AI on Lead L-2</h3>
        <div class="counts"><div><b>${done}</b><span class="muted">approved messages sent automatically</span></div><div><b>${n.draft==='pending'?1:0}</b><span class="muted">AI-written reply waiting</span></div></div>
        <p class="small muted">Templates and guided questions run on their own: the Owner approved each published template and its automatic use. Which answer is shown is picked by a rule (the menu, the guided flow), never by the AI. ${tag('AIW-D102')}${tag('AIW-D105')}</p>
        ${n.guided>=GUIDED.length?`<div class="notice ok"><span class="ic">✓</span><div class="small">Guided intake complete. The answers are stored as stated by the lead, not verified. Intake AI may now start the assessment (screen 3).</div></div>`:''}
      </div>
      ${item}
      <div class="card card-pad stack"><div class="row" style="justify-content:space-between"><b class="small">Conversational AI for intake, FAQs and booking</b><button class="switch" role="switch" aria-checked="false" disabled aria-label="Conversational AI (not available)"></button></div>
        <p class="xs muted">Designed for later. Off until a separate decision with the team. Any AI-written reply sent without approval needs that decision too. ${tag('AIW-D102')}</p></div>
    </div>`;
  })();
  return head('Screen 6 of 6','Intake chat at launch',`A chat on Firm F's website. Approved templates and guided intake questions run automatically. Answers are picked by a rule. Any newly AI-written reply waits for a person's approval before it is sent. ${tag('AIW-D102')}`) + `
  <div class="scenario"><span>◇</span><div><b>Scenario.</b> Lead L-2 (made up) opens the chat on Firm F's website. Click the topics, answer the guided questions, or type your own question to see the hand-off.</div></div>
  <div class="chatwrap">
    <div class="chat"><div class="chat-head"><span>Firm F · chat</span><span class="xs muted">What the lead sees</span></div>
      <div class="chat-body" id="chat-body">${n.msgs.map(bubble).join('')}</div>
      <div class="chat-foot"><div class="chips">${chips}</div>
        <div class="row" style="gap:6px"><input type="text" id="in-q" placeholder="Ask something else…" style="flex:1;min-width:0" aria-label="Type a question"><button class="btn sm" data-act="in-ask">Send</button></div></div>
    </div>
    ${staff}
  </div>
  ${foot('AIW-D102 (approved templates and guided intake automatic; chat serves approved content; AI-written replies need approval; future conversational AI off until a separate decision), AIW-D105 (firm-approved template use counts as approval), AIW-D41 (eligibility only from the consultant), AIW-D92; autonomy model c.2 (answer chosen by a rule, never a model).')}`;
}

/* ======================================================================
   ABOUT
   ====================================================================== */
function scAbout(){
  return head('About','About this prototype') + `
  <div class="card card-pad about">
    <p><b>What it is.</b> A clickable simulation of the agreed design for Expat Ready's AI team, for the founder and the product team. <b>Prototype: simulated data, not the product.</b> The firm, people, files, values, programs, rules, amounts and pack versions are made up. Every step is played by this page's own script: no rules engine runs, no AI model is called, and nothing is sent anywhere.</p>
    <p><b>Nothing has been tested.</b> This page does not show test results. Health lights stay grey ("Not yet measured"), and earned Auto can only be shown with a demo control, because no skill has taken its test.</p>
    <p><b>Built from</b> (12 Oct 2026): the founder's decisions AIW-D89 and AIW-D92 to AIW-D105 with the AIW-D98 note; the AI autonomy model (Proposal, revision 5: presets, grid, end-of-job review, row table, worked example); the four journey walkthroughs; the Lead's rulings of 12 Oct (G-2, G-7, M-2, M-3, M-4); the AI team profiles. Replaces the 11 Oct version built from AW-01 v0.5, whose words and limits the founder has since changed.</p>
    <p><b>How to read it.</b></p>
    <ul>
      <li>Every output carries one of four labels: "Calculated by the rules, pack v[n]", "Prepared by [AI teammate]", "AI draft: check before use", "Approved by [person]".</li>
      <li>Small grey tags show the decision behind an element. Turn them off with <b>Show decision IDs</b>.</li>
      <li>Dashed purple boxes are <b>demo controls</b>: they play a part the real product leaves to someone else, such as a pack update.</li>
      <li>People appear only by role. AI teammates appear only by their in-product names.</li>
      <li>Screens share one story: what you do on screens 2, 3, 4 and 6 changes the counts on screen 1.</li>
    </ul>
    <p><b>Not shown here.</b> The readiness report screen; the two-person review played through (only a note says it is two sittings, values first); a client message drafted inside a file job; exports, deletion requests and signature workflows prepared by the AI (only a settings change is played, on screen 5); the daily summary; switches and pauses; the Pack author's AI and Support AI at work; Practice answers.</p>
    <p class="small muted" style="margin-top:14px">The autonomy model and journey mechanisms are Proposals with Lead rulings; grid storage, the holding state for the review and the screens themselves are the team's to build. The wording here is illustrative, not a screen specification.</p>
  </div>
  ${foot('AIW-D89, AIW-D92 to AIW-D105, AIW-D98 note; README §0 rules 7, 9, 10.')}`;
}

/* =============================== events =============================== */
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){ S.screen = go.dataset.go; S.drawer=null; render(); $('#main').focus({preventScroll:true}); window.scrollTo(0,0); return; }
  const th = e.target.closest('[data-theme-set]');
  if(th){ S.theme = th.dataset.themeSet; if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); try{localStorage.setItem('aiw-theme', S.theme);}catch(_){} renderNav(); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if(el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type==='text')) return;
  const r = S.rv, a = S.as, b = S.bl, n = S.inb;
  switch(act){
    case 'tags': S.tags = !S.tags; renderNav(); return;
    case 'drawer': S.drawer = +v; break;
    case 'drawer-close': S.drawer = null; break;
    /* job */
    case 'j-play': S.job.stopped=false; play(); return;
    case 'j-stop': stopTimer(); S.job.stopped = true; break;
    case 'j-resume': S.job.stopped = false; break;
    case 'j-ap': S.job.ap[v] = true; S.job.i++; play(); return;
    /* review */
    case 'rv-open': r.opened[v] = true; break;
    case 'rv-check': if(el.checked){ r.ok[v] = true; } break;
    case 'rv-conf': { const prev = empInDrafts(); r.conflict = v; delete r.corr.emp; if(empInDrafts()!==prev) markStale('emp'); break; }
    case 'rv-corr': r.editing = v; break;
    case 'rv-corr-cancel': r.editing = null; break;
    case 'rv-corr-save': { const i=$('#corr-in'); const val = i ? i.value.trim() : ''; if(!val){ i&&i.focus(); return; }
      const vv = VALS.find(x=>x.id===v); if(val !== curVal(vv)){ r.corr[v] = val; if(v==='emp' && !r.conflict) r.conflict='a'; markStale(v); } r.editing=null; break; }
    case 'rv-spot': { const i=$('#spot-in'); const val=(i?i.value:r.spot).trim(); if(!val){ i&&i.focus(); return; }
      r.spot = val; r.spotRes = val.toLowerCase().replace(/[^a-z]/g,'').startsWith('exampleanalytics') ? 'match' : 'nomatch'; break; }
    case 'rv-rest': r.rest = true; break;
    case 'rv-dok': r.drafts[v] = 'approved'; break;
    case 'rv-rej': r.rejecting = v; break;
    case 'rv-rej-cancel': r.rejecting = null; break;
    case 'rv-rej-ok': { const t=$('#rej-'+v); const why = t?t.value.trim():''; if(!why){ t&&t.focus(); return; } r.reason[v]=why; r.drafts[v]='rejected'; r.rejecting=null; break; }
    case 'rv-reset': Object.assign(S.rv, {ok:{}, opened:{}, corr:{}, editing:null, spot:'', spotRes:null, rest:false, conflict:null, drafts:{form:'pending',letter:'pending',note:'pending'}, ver:{form:1,letter:1,note:1}, stale:{}, rejecting:null, reason:{}}); break;
    /* assessment */
    case 'as-ev': a.ev = v; a.phase='idle'; a.explained=false; a.reviewed=false; a.pack=3; a.newer=false; break;
    case 'as-start': a.phase = a.ev==='ready' ? 'run' : 'stopped'; break;
    case 'as-fix': a.ev = 'ready'; a.phase = 'run'; break;
    case 'as-pack': a.newer = true; break;
    case 'as-rerun': a.pack = 4; a.newer = false; a.explained = false; a.reviewed = false; break;
    case 'as-explain': a.explained = true; break;
    case 'as-review': a.reviewed = true; break;
    case 'as-reset': a.phase='idle'; a.explained=false; a.reviewed=false; a.pack=3; a.newer=false; break;
    /* billing */
    case 'bl-change': b.changed = true; b.inv = 'voided'; break;
    case 'bl-inv-ok': b.inv = 'approved'; b.invAt = nowStamp(); break;
    case 'bl-inv-rej': b.inv = 'rejected'; break;
    case 'bl-tr-ok': b.trust = 'approved'; b.trustAt = nowStamp(); break;
    case 'bl-tr-rej': b.trust = 'rejected'; break;
    case 'bl-reset': Object.assign(b, {inv:'pending', ver:1, changed:false, invAt:null, trust:'none', trustAt:null}); break;
    /* settings */
    case 'preset': S.set.preset = v; S.set.over = {}; break;
    case 'grid-open': S.set.open = !S.set.open; break;
    case 'grid-reset': S.set.over = {}; break;
    case 'chg-edit': S.set.chg = 'voided'; S.set.chgTo = 21; break;
    case 'chg-ok': S.set.chg = 'approved'; S.set.chgAt = nowStamp(); break;
    case 'chg-rej': S.set.chg = 'rejected'; break;
    case 'earn': S.set.earned = !S.set.earned; Object.keys(S.set.over).forEach(k=>{ if(k.startsWith('3-')) delete S.set.over[k]; }); break;
    /* intake */
    case 'in-menu': {
      inbInit();
      const labelsTxt = {book:'Book a consultation', docs:'What documents will I need?', fees:'Fees', elig:'Am I eligible?'};
      n.msgs.push({from:'lead', text:labelsTxt[v]});
      n.msgs.push({from:'firm', tpl:v, rule:'menu option "'+labelsTxt[v]+'"'});
      if(v==='elig' && n.guided < GUIDED.length) n.msgs.push({from:'firm', guided:n.guided});
      break; }
    case 'in-g': {
      n.msgs.push({from:'lead', text:v}); n.guided++;
      if(n.guided < GUIDED.length) n.msgs.push({from:'firm', guided:n.guided});
      else n.msgs.push({from:'firm', tpl:'book', rule:'guided intake finished → offer a consultation'});
      break; }
    case 'in-ask': {
      const i = $('#in-q'); const q = i ? i.value.trim() : ''; if(!q){ i&&i.focus(); return; }
      inbInit(); n.msgs.push({from:'lead', text:q});
      n.msgs.push({from:'firm', tpl:'handoff', rule:'no published answer matches → hand off to a person'});
      n.q = q; n.draft = 'pending'; n.edit=false;
      n.text = 'Thank you for your question. We can help with this. A licensed consultant can go through the details with you in a consultation, which you can book with the link in this chat. If you prefer, reply here with a good time to call you.';
      break; }
    case 'in-edit': n.edit = true; break;
    case 'in-edit-save': { const t=$('#in-edit'); if(t) n.text = t.value; n.edit=false; break; }
    case 'in-ap': n.msgs.push({from:'firm', ai:true, text:n.text}); n.draft='approved'; break;
    case 'in-rej': n.draft='rejected'; break;
    default: return;
  }
  render();
  const cb = $('#chat-body'); if(cb) cb.scrollTop = cb.scrollHeight;
});
document.addEventListener('change', e=>{
  const el = e.target;
  if(el.dataset && el.dataset.act==='grid'){ S.set.over[el.dataset.k] = el.value; render(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='spot-in'){ e.preventDefault(); const b=document.querySelector('[data-act="rv-spot"]'); b&&b.click(); }
  if(e.key==='Enter' && e.target.id==='in-q'){ e.preventDefault(); const b=document.querySelector('[data-act="in-ask"]'); b&&b.click(); }
  if(e.key==='Enter' && e.target.id==='corr-in'){ e.preventDefault(); const b=document.querySelector('[data-act="rv-corr-save"]'); b&&b.click(); }
  if(e.key==='Escape' && S.drawer!=null){ S.drawer=null; render(); }
});
document.addEventListener('input', e=>{ if(e.target.id==='spot-in') S.rv.spot = e.target.value; });

/* =============================== init =============================== */
try{ const t = localStorage.getItem('aiw-theme'); if(t==='light'||t==='dark'){ S.theme=t; document.documentElement.setAttribute('data-theme', t); } }catch(_){}
render();
})();
</script>
