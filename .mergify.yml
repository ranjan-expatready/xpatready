# Merge queue with batches (P-201, founder 31 Oct). An approved PR enters the queue; Mergify combines up to 6 of them
# the way they will land on main, runs the full check once on that batch PR (branch mergify/merge-queue/...), and merges
# them all when it passes. A failing batch is split until the PR that broke it is found; the others still merge.
# P-210 (founder 1 Nov, the free fix): one batch checked at a time (the Mac has one test runner: stacked batches were
# cancelled whenever one ahead failed, 43% of its time on 31 Oct), batches of up to 6, and a PR joins only once its own
# check is green, so a batch fails only on how PRs combine.
# Founder 1 Nov night (reverses P-210's limit of one): the repository is public, so batches run free on GitHub's
# machines, not the one Mac; up to 3 batches are checked at once, each assuming the ones ahead of it pass.
merge_queue:
  max_parallel_checks: 3

# Two queues, M2 first (founder 4 Nov ~12:05 IST, "I agree with your plan"): M2 and M3 PRs never share a batch, so a
# broken M3 PR can never throw out M2 work, and M2 is checked first (the queue listed first has the higher priority).
# A PR goes to "m3" when its title names an M3 capability, or starts with "M3" (the M3 rows of qa/CAPABILITIES.md; the tech lead keeps this
# list in step with that table); everything else, including every M2 PR, goes to "m2".
# Records never block code (B119, P-376 (1), founder 6 Nov; one route, Lead 21's ruling on #1147, 6 Nov): a third queue
# "records", listed last (lowest priority), takes a PR labelled "records". CI applies that label to a records-only PR
# (tools/records-only.sh, P-371 (4), #1139: every file is a record under product/, not product/tools/, and not code),
# so there is one definition of a record. m2 and m3 skip the label. A records PR is checked only when no product
# PR waits ahead of it, and a product PR that arrives goes ahead of it, so a records merge never restarts a product batch;
# records also never share a batch with code. Records merge only through this queue, never outside it.
# product/screens/B119/check-queue-rules.py reads this file and fails when the queues stop routing that way. The daily
# records PR (P-336) stays.
queue_rules:
  - name: m2
    batch_size: 6
    # F6 (founder 6 Nov, "Yes, apply all seven"): a 24-hour trial of 5 min (was 2 min), so batches fill; review 7 Nov
    # ~21:00 IST: kept if PRs per batch rises (baseline 1.6) and approved-to-merged median does not get worse.
    batch_max_wait_time: 5 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - -title~=(?i)(^M3\b|\bC1\.3\b|\bC3\.16\b|\bC6\.(4|5|9|11|12)\b|\bC7\.[3567]\b|\bC8\.[12]\b|\bC9\.2\b|\bC10\.2\b|\bC11\.[56]\b)
      - -label=records
    merge_conditions:
      - check-success = ci
    merge_method: merge
  - name: m3
    batch_size: 6
    # F6 (founder 6 Nov, "Yes, apply all seven"): a 24-hour trial of 5 min (was 2 min), so batches fill; review 7 Nov
    # ~21:00 IST: kept if PRs per batch rises (baseline 1.6) and approved-to-merged median does not get worse.
    batch_max_wait_time: 5 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - title~=(?i)(^M3\b|\bC1\.3\b|\bC3\.16\b|\bC6\.(4|5|9|11|12)\b|\bC7\.[3567]\b|\bC8\.[12]\b|\bC9\.2\b|\bC10\.2\b|\bC11\.[56]\b)
      - -label=records
    merge_conditions:
      - check-success = ci
    merge_method: merge
  - name: records
    batch_size: 6
    batch_max_wait_time: 2 min
    queue_conditions:
      - base = main
      - -draft
      - "label = review: approved"
      - check-success = ci
      - label = records
    merge_conditions:
      - check-success = ci
    merge_method: merge

# -draft (P-371 (1), founder 6 Nov): a draft never joins a batch; a draft runs only the push guard. Records PRs carry the
# label "records", set by records-label.yml (main's tools/records-only.sh; before 7 Nov ci.yml's job "kind"); the
# "records" queue that selects it, and the "-label=records"
# that keeps it out of m2 and m3, are B119's (#1147, Lead 21's ruling, 6 Nov; see above).

# Approved PRs join the queue by themselves (the queue_conditions above decide which); no "@mergifyio queue" needed.
merge_protections_settings:
  auto_merge_conditions: true
